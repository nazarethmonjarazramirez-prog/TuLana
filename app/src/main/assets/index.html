<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF1EF">
<title>TuLana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 460px), barra de navegación fija abajo, tarjetas solo donde marcan un objeto. */
:root{
  --bg:#EAF1EF; --surface:#FFFFFF; --sunk:#DCE7E4; --ink:#0E2925; --muted:#5A716C; --line:#C9D9D5;
  --accent:#FF5C8A; --accent-ink:#FFFFFF; --mint:#18A877; --mint-soft:#CDEFE2;
  --glass:rgba(210,236,231,.55); --glass-edge:#7FA9A1; --liquid:#22B886; --liquid-2:#7FE0BC; --shine:rgba(255,255,255,.75);
  --warn:#A86200; --warn-soft:#FFF1D6; --bad:#C62A3A; --bad-soft:#FFE1E4; --good:#138A5E; --imp:#6D3FE0; --imp-soft:#EDE6FD;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A18; --surface:#13282498; --sunk:#0F2421; --ink:#E5F2EF; --muted:#8FA8A2; --line:#24403B;
  --accent:#FF7FA2; --accent-ink:#2A0712; --mint:#3CD39C; --mint-soft:#123A2E;
  --glass:rgba(120,190,176,.12); --glass-edge:#5E8E85; --liquid:#1FA97A; --liquid-2:#3FD7A1; --shine:rgba(255,255,255,.28);
  --warn:#F2B04A; --warn-soft:#3A2A0C; --bad:#FF7A86; --bad-soft:#3D1218; --good:#3CD39C; --imp:#B79BFF; --imp-soft:#2A2145; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1A18; --surface:#13282498; --sunk:#0F2421; --ink:#E5F2EF; --muted:#8FA8A2; --line:#24403B;
  --accent:#FF7FA2; --accent-ink:#2A0712; --mint:#3CD39C; --mint-soft:#123A2E;
  --glass:rgba(120,190,176,.12); --glass-edge:#5E8E85; --liquid:#1FA97A; --liquid-2:#3FD7A1; --shine:rgba(255,255,255,.28);
  --warn:#F2B04A; --warn-soft:#3A2A0C; --bad:#FF7A86; --bad-soft:#3D1218; --good:#3CD39C; --imp:#B79BFF; --imp-soft:#2A2145; color-scheme:dark }

html,body{min-height:100%;margin:0}
body{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{max-width:460px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800} h2{font-size:22px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sec-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:14px 4px -4px}
.sec-title:first-of-type{margin-top:2px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px} .stack.lg{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 20px;font:600 15px var(--body);cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%} .btn.sm{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);font:500 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;box-sizing:border-box}
textarea{font-family:var(--mono);font-size:13px;min-height:140px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--mint-soft);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-size:24px;font-weight:800}
.lvl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
nav.tabs .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{background:none;border:0;color:var(--muted);font:600 11.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab.fab span.ring{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent)}
.tab.fab svg{width:26px;height:26px}

/* Donut */
.donut-wrap{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr}.donut{max-width:220px}.legend{display:grid;grid-template-columns:1fr 1fr;column-gap:4px}}
.donut{width:100%;max-width:200px;aspect-ratio:1;justify-self:center}
.donut circle.slice{cursor:pointer;transition:stroke-width .2s, opacity .2s}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:6px 8px;border-radius:10px;color:var(--ink);font:500 14px var(--body);text-align:left;cursor:pointer}
.legend button span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend button[aria-pressed="true"]{background:var(--sunk)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 0;font:600 13.5px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar.over>i{background:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 13px var(--display);color:#fff}

.nudge{background:var(--ink);color:var(--bg);border:0}
.nudge .label{color:inherit;opacity:.7}

/* Pig */
.pig{width:100%;max-width:330px;display:block;margin:0 auto;overflow:visible}
.pig .wave{animation:wave 5.5s linear infinite}
.pig .wave.back{animation-duration:8s;animation-direction:reverse;opacity:.55}
.pig .level{transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes wave{to{transform:translateX(-160px)}}
.pig .coin-drop{animation:drop 1s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--fall));opacity:0}}
.pig.bounce{animation:bounce .6s ease}
@keyframes bounce{30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.02)}}
.pct{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms{border-radius:14px;padding:10px 6px;text-align:center;background:var(--sunk);font:700 15px var(--display);color:var(--muted)}
.ms.on{background:var(--mint-soft);color:var(--good)}
.ms small{display:block;font:500 11px var(--body)}

/* Onboarding */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:22px;padding-top:6px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.onb .q{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;text-wrap:balance}
.onb .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.rowedit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.rowedit.acc{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) auto}
@media (max-width:400px){.rowedit.acc{grid-template-columns:1fr 1fr auto}.rowedit.acc .typ{grid-column:1/3}}
.x{border:0;background:var(--sunk);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.sumbox{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sumbox .row{justify-content:space-between}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}

/* Scan */
.drop{border:2px dashed var(--glass-edge);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--glass);cursor:pointer}
.drop svg{width:44px;height:44px;color:var(--accent)}
.scanning{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk);min-height:220px;display:grid;place-items:center}
.scanning img{max-height:320px;object-fit:contain;opacity:.85}
.scanning .beam{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);animation:beam 1.8s ease-in-out infinite alternate}
@keyframes beam{from{top:6%}to{top:92%}}
.item{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:12px;border-radius:14px;background:var(--sunk);position:relative}
.item.review{background:var(--warn-soft);outline:1.5px solid var(--warn)}
.item .raw{grid-column:1/-1;font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.item input,.item select{padding:9px 10px;font-size:15px}
.item .cat{grid-column:1/2}
.item .del{position:absolute;top:8px;right:8px;width:28px;height:28px;font-size:15px}
.item .namefld{padding-right:36px}
.warnings{display:flex;flex-direction:column;gap:6px}
.warnings p{font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.warnings p.bad{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(420px, calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast .3s ease}
@keyframes toast{from{transform:translate(-50%,12px);opacity:0}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border-radius:14px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;opacity:.5}
.badge.on{opacity:1;background:var(--mint-soft)}
.badge b{font-family:var(--display);font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* Temporadas */
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.greet{font:700 14px var(--body);color:var(--accent);margin-top:2px}
.season{position:relative;border-radius:var(--r);overflow:hidden;background:color-mix(in srgb, var(--accent) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--accent) 28%, var(--line))}
.season .garland{display:block;width:100%;height:58px}
.season-body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:8px}
.season-body .label{color:var(--accent)}
.season .x{position:absolute;top:8px;right:8px;background:var(--surface);width:30px;height:30px;font-size:16px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.stamp{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.stamp b{font:700 13.5px var(--display);color:var(--ink)}
.stamp span{font-size:12px}
.stamp.now{border-style:solid;border-color:var(--accent)}
.stamp.now span{color:var(--accent);font-weight:600}
.stamp.on{background:var(--sc);border:1.5px solid var(--sc);color:#fff}
.stamp.on b{color:#fff}
.pig .bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.toggle input{width:20px;height:20px;flex:none;padding:0;accent-color:var(--accent)}
/* Merino */
.say{display:flex;gap:10px;align-items:flex-end}
.say-av{flex:none;width:78px}
.say.sm .say-av{width:60px}
.say-av svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bubble p{margin:0;font-size:14.5px;font-weight:500;line-height:1.45}
.say.noav .bubble{border-radius:18px}
.say.hero{flex-direction:column;align-items:center;gap:6px}
.say.hero .say-av{width:min(210px, 56vw)}
.say.hero .bubble{border-radius:18px;text-align:center;flex:none;max-width:340px}
.say.hero .bubble::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.merino .blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.merino .body{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.025,1.018)}}
.merino .waving{animation:hoofwave 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:144px 128px}
@keyframes hoofwave{50%{transform:rotate(-16deg)}}
.merino .bob{animation:bob 3.2s ease-in-out infinite}
/* Colores con significado: acento = acción, rojo = problema, ámbar = revisar, violeta = gasto impulsivo */
.pill.imp{background:var(--imp-soft);color:var(--imp)}
button.pill{border:0;cursor:pointer;font:600 12.5px var(--body)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;margin:0}
.alert::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--body);color:#fff;background:var(--muted)}
.alert.bad::before{background:var(--bad)}
.alert.warn::before{background:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--sunk);color:var(--ink)}
.alert.info::before{content:"i"}
.btn.danger{background:var(--bad);color:#fff}
.money.big{font-size:34px;font-weight:500}
.calc{display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{font-size:18px}
.inline-form{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.li-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer}
.li-btn:last-child{border-bottom:0}
.card-btn{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.acc-pic{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font:600 18px var(--display);color:var(--ink)}
.legal{text-align:center;line-height:1.5}
.legal a{color:inherit;text-underline-offset:3px}
.cost-line{margin:2px 0 0;color:var(--muted)}
.cost-line b{color:var(--ink)}
.retos .reto{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.retos .reto:first-of-type{border-top:0}
.reto-op{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.reto-op > div{display:flex;flex-direction:column;gap:2px}
.bar.bad i{background:var(--warn)}
button.badge{font:inherit;color:inherit;text-align:left;cursor:pointer;border:0}
.share-tag{font-size:11px;font-weight:700;color:var(--accent);margin-top:2px}
.cfg-list{padding:4px 0;gap:0}
.cfg-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.cfg-row:first-child{border-top:0}
.cfg-ic{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.cfg-ic svg{width:20px;height:20px}
.cfg-ic.big{width:44px;height:44px;border-radius:13px}
.cfg-ic.big svg{width:24px;height:24px}
.cfg-title{display:flex;align-items:center;gap:12px}
.cfg-t{flex:1;font-weight:600;min-width:0}
.cfg-x{color:var(--muted);font-size:13px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-chev{color:var(--muted);font-size:22px;line-height:1}
.cfg-title{margin:4px 0 8px}
.cfg-page details > summary{display:none}
.cfg-page details > summary h3{display:none}
.cfg-page details{border:0}
.cel-ov{position:fixed;inset:0;z-index:90;background:rgba(20,14,10,.45);display:grid;place-items:center;padding:20px;animation:celIn .25s ease-out}
.cel-ov.out{opacity:0;transition:opacity .2s}

/* ═════════════ Piel nueva (sistema de diseño TuLana) ═════════════ */
:root{ --merino-paliacate: var(--accent); --sec:#2F5D3A; --exp:#9A3A1F; --inc:#2F5D3A; --display:"Figtree","Segoe UI",system-ui,sans-serif; --mono:"Figtree","Segoe UI",system-ui,sans-serif; }
/* Tinta y colores secundarios de cada estación (las fiestas usan los de la estación en que caen) */
:root[data-art="otono"]{--ink:#2E1D14;--muted:#6B5243;--sec:#2F5D3A;--surface:#FFF9EE;--exp:#9A3A1F;--inc:#2F5D3A;--good:#2F5D3A;--mint:#2F5D3A;--mint-soft:#DDEBD3}
:root[data-art="invierno"]{--ink:#16324A;--muted:#4A6275;--sec:#1F4E5F;--surface:#FFFFFF;--exp:#A12B33;--inc:#2E6B57;--good:#2E6B57;--mint:#2E6B57;--mint-soft:#D8EAE2}
:root[data-art="primavera"]{--ink:#23402B;--muted:#536656;--sec:#2F6B45;--surface:#FFFFFF;--exp:#A3304F;--inc:#2F6B45;--good:#2F6B45;--mint:#2F6B45;--mint-soft:#DCEBD3}
:root[data-art="verano"]{--ink:#12384A;--muted:#4B6470;--sec:#0E6B73;--surface:#FFFFFF;--exp:#B03A22;--inc:#0E6B73;--good:#0E6B73;--mint:#0E6B73;--mint-soft:#D3ECEC}
/* Capa de arte pintado detrás del contenido */
.deco-app{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco-frame{position:absolute;top:0;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%)}
.deco-app svg{position:absolute}
.art-back{inset:0;width:100%;height:100%}
.art-top{top:-34px;right:-54px;width:320px;filter:drop-shadow(0 6px 6px rgba(90,40,10,.18));will-change:transform}
.art-left{bottom:150px;left:-46px;width:180px;filter:drop-shadow(0 6px 6px rgba(90,40,10,.18))}
.art-ground{left:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:100%;height:76px}
.falls{position:absolute;inset:0}
.fall2{position:absolute;top:-60px;animation:fall2 linear infinite;filter:drop-shadow(0 3px 3px rgba(90,40,10,.18))}
.fall2.near{filter:blur(1.6px) drop-shadow(0 4px 4px rgba(90,40,10,.2));opacity:.9}
.fall2 .flut{display:block;animation:flutter ease-in-out infinite alternate;transform-origin:50% 20%}
.fall2 svg{display:block;width:100%;height:auto}
@keyframes fall2{0%{transform:translate(0,-60px)}25%{transform:translate(34px,24vh)}50%{transform:translate(-8px,50vh)}75%{transform:translate(30px,76vh)}100%{transform:translate(0,108vh)}}
@keyframes flutter{0%{transform:rotate(-35deg) rotateY(0)}100%{transform:rotate(40deg) rotateY(160deg)}}
.fall2.snow .flut{animation-name:sway}
.fall2.snow .dot{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#E6F0F7 70%);box-shadow:0 0 4px rgba(255,255,255,.9),0 1px 2px rgba(30,70,100,.18)}
.fall2.snow svg{height:100%}
@keyframes sway{0%{transform:translateX(-6px) rotate(-20deg)}100%{transform:translateX(8px) rotate(30deg)}}
.fly{position:absolute;left:-50px;width:34px;animation:fly linear infinite;filter:drop-shadow(0 4px 4px rgba(60,40,80,.2))}
.fly svg{display:block;width:100%;overflow:visible}
.fly .wl,.fly .wr{animation:flap .28s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes fly{0%{transform:translate(0,0) rotate(8deg)}20%{transform:translate(110px,-40px) rotate(-6deg)}40%{transform:translate(220px,10px) rotate(10deg)}60%{transform:translate(330px,-50px) rotate(-8deg)}80%{transform:translate(440px,-10px) rotate(6deg)}100%{transform:translate(620px,-40px)}}
.fly.gull{width:30px;filter:none}
.gull .bw{animation:gullflap .5s ease-in-out infinite alternate;transform-origin:0 2px}
@keyframes gullflap{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
.rise{position:absolute;top:100%;animation:rise linear infinite}
.rise svg{display:block;width:100%;height:100%}
.rise .bokeh{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.9),rgba(255,226,140,0) 70%)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(18px,-48vh)}90%{opacity:1}100%{transform:translate(-6px,-100vh);opacity:0}}
.rays{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift 9s ease-in-out infinite alternate}.cloud.c2{animation-duration:12s}.cloud.c3{animation-duration:15s;animation-delay:-4s}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
.art-ground .wave{animation:seafoam 4s ease-in-out infinite alternate}
@keyframes seafoam{to{transform:translateX(-30px)}}
.art-still .falls{display:none}
.art-still .rays,.art-still .cloud,.art-still .art-ground .wave{animation:none}
/* Arte del aviso de temporada, corona de la dona y decoraciones de tarjeta */
.season .season-art{position:absolute;right:-18px;top:-14px;width:150px;pointer-events:none;z-index:0}
.season .season-art svg{display:block;width:100%;filter:drop-shadow(0 6px 6px rgba(90,40,10,.2))}

.season .x{z-index:3}
.wreath-box{position:relative;width:100%;max-width:200px;aspect-ratio:1;justify-self:center}
.wreath-box .donut{max-width:none;width:100%;position:relative}
.art-wreath{position:absolute;left:-15.7%;top:-15.7%;width:131.4%;height:131.4%;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(90,40,10,.18))}
.art-stick{position:absolute;width:74px;pointer-events:none;z-index:2;filter:drop-shadow(0 4px 4px rgba(90,40,10,.2))}
.art-stick.tr{top:-24px;right:-14px}.art-stick.tl{top:-22px;left:-16px}.art-stick.br{bottom:-22px;right:-12px}.art-stick.bl{bottom:-24px;left:-16px}
.bubble,.card,.season{position:relative}
/* Merino oficial: respira, parpadea y saluda */
.merino .cuerpo{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

.say.hero .say-av{width:min(190px,50vw)}
/* Tarjetas de vidrio cálido, botones con volumen y títulos legibles sobre la ilustración */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .card,:root:not([data-theme="dark"]) .bubble{
  background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-color:color-mix(in srgb,var(--line) 85%,#fff);background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%);

.tab.fab span.ring{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),color-mix(in srgb,var(--accent) 86%,#000));border:4px solid var(--bg);animation:fabpulse 2.8s ease-in-out infinite}
@keyframes fabpulse{50%{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent),0 0 0 8px color-mix(in srgb,var(--accent) 15%,transparent)}}
.season{background:linear-gradient(160deg,color-mix(in srgb,var(--liquid-2) 14%,var(--surface)),color-mix(in srgb,var(--liquid-2) 34%,var(--surface)))}
.top h1,.hello,.greet,.app > .label{text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg),0 0 18px var(--bg);position:relative}

/* ── Igual al prototipo: fondo de papel, encabezado, aviso de temporada, avisos, burbujas y tarjetas ── */

  var(--bg)}

/* ═════════════ Modo oscuro (sigue al dispositivo) ═════════════
   El fondo, el acento y el líquido salen de la paleta oscura de cada estación o fiesta (season-style).
   Aquí se derivan el resto de colores del diseño nuevo para que sirvan en cualquier tema (estaciones y fiestas).
   Mayor especificidad que :root[data-art="..."] para ganarle también a los colores que inyectan las fiestas. */
@media (prefers-color-scheme: dark){
  :root[data-art]:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#F4EDE4; --muted:#BFB4A8;
    --surface:color-mix(in srgb,var(--sunk),#fff 7%);
    --sec-t:color-mix(in srgb,var(--sec) 45%,#fff);

<script>/* arte-app.js */
/* TuLana · Adaptador del arte de temporada para la app.
   Los archivos <temporada>-arte.js se registran con ARTE.registrar() (igual que en el sistema de diseño).
   Aquí se montan sobre la app real: capa fija detrás del contenido (fondo desenfocado, rama, suelo y lo que cae),
   arte del aviso de temporada, corona de la dona, decoraciones de tarjeta y adorno del cochinito. */
(function () {
  const REG = {};
  let current = null, scene = null, fxOn = true, parallaxOn = false;

  window.ARTE = {
    registrar(nombre, def) { REG[nombre] = def; },
    disponibles() { return Object.keys(REG); }
  };

  function ensureLayers() {
    if (!document.getElementById('artDefs')) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.id = 'artDefs'; s.setAttribute('width', '0'); s.setAttribute('height', '0'); s.setAttribute('aria-hidden', 'true');
      s.style.position = 'absolute'; document.body.prepend(s);
      s.innerHTML = Object.values(REG).map(r => r.defs).join('');
    }
    let deco = document.getElementById('deco');
    if (!deco) { deco = document.createElement('div'); deco.id = 'deco'; deco.className = 'deco-app'; deco.setAttribute('aria-hidden', 'true'); document.body.prepend(deco); }
    return deco;
  }

  function parallax() {
    if (parallaxOn) return; parallaxOn = true;
    addEventListener('scroll', () => {
      if (!fxOn || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const y = scrollY, back = document.querySelector('#deco .art-back'), top = document.querySelector('#deco .art-top');
      if (back) back.style.transform = `translateY(${-y * 0.12}px)`;
      if (top) top.style.transform = `translateY(${-Math.min(y, 300) * 0.35}px)`;
    }, { passive: true });
  }

  const PIG = {
    otono: '<g transform="translate(206 52) rotate(20)"><use href="#lf-maple-orange" x="-16" y="-16" width="32" height="37"/></g><g transform="translate(226 60) rotate(-25)"><use href="#lf-oak-yellow" x="-9" y="-16" width="18" height="33"/></g>',
    invierno: '<g transform="translate(212 58)"><use href="#w-holly" x="-26" y="-20" width="22" height="34" transform="rotate(-40)"/><use href="#w-holly" x="-6" y="-24" width="22" height="34" transform="rotate(30)"/><use href="#w-berry" x="-12" y="-4" width="12" height="12"/><use href="#w-berry" x="-2" y="-1" width="11" height="11"/></g>',
    primavera: '<g transform="translate(212 56)"><path d="M0 12 Q-1 0 0 -10" stroke="#4E8A45" stroke-width="2.5" fill="none"/><use href="#s-leaf" x="-16" y="-12" width="10" height="22" transform="rotate(-50 -11 -1)"/><use href="#s-leaf" x="4" y="-10" width="10" height="22" transform="rotate(50 9 1)"/><use href="#s-bl-pink" x="-11" y="-26" width="22" height="22"/></g>',
    verano: '<g transform="translate(210 56)"><use href="#v-hib" x="-16" y="-18" width="32" height="32"/><use href="#v-plum" x="6" y="-4" width="16" height="16"/></g>'
  };

  window.ARTE_APP = {
    tiene(nombre) { return !!REG[nombre]; },
    pintar(nombre) {
      if (!REG[nombre] || current === nombre) return;
      const deco = ensureLayers();
      current = nombre; scene = REG[nombre].escena();
      // Colores de interfaz propios del tema (las fiestas los traen en su registro; las estaciones están en index.html)
      let st = document.getElementById('artVars');
      if (!st) { st = document.createElement('style'); st.id = 'artVars'; document.head.appendChild(st); }
      const v = REG[nombre].vars;
      st.textContent = v ? `:root[data-art="${nombre}"]{${Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';')}}` : '';
      deco.innerHTML = `<div class="deco-frame">${scene.back}${scene.top}${scene.left}${scene.ground || ''}<div class="falls">${scene.falls}</div></div>`;
      deco.dataset.season = nombre;
      document.documentElement.dataset.art = nombre;
      this.fx(fxOn); parallax();
    },
    apagar() { current = null; scene = null; const d = document.getElementById('deco'); if (d) d.innerHTML = ''; delete document.documentElement.dataset.art; },
    fx(on) { fxOn = on; document.documentElement.classList.toggle('art-still', !on); },
    // Se llama después de cada render de la app
    decorar() {
      if (!scene) return;
      document.querySelectorAll('.season-art').forEach(el => { if (!el.firstChild) el.innerHTML = scene.hero; });
      const d = document.querySelector('.donut');
      if (d && !d.closest('.wreath-box')) {
        const box = document.createElement('div'); box.className = 'wreath-box';
        d.before(box); box.appendChild(d); box.insertAdjacentHTML('afterbegin', scene.wreath);
      }
      const put = (sel, pos) => { const el = document.querySelector(sel); if (el && !el.querySelector(':scope > .art-stick') && scene.stick[pos]) el.insertAdjacentHTML('beforeend', scene.stick[pos]()); };
      put('.app .say .bubble', 'tr');
      put('.app .saldo', 'bl');
      put('#month-card', 'tr');
      put('.app .blob.out', 'tr');
      put('.app .blob.in', 'bl');
      put('.app .movs', 'tr');
      put('.app > .card:last-child', 'br');
    },
    pigDeco(nombre) { return PIG[nombre] || REG[nombre]?.pig || ''; }
  };
})();

</script>
<script>/* otono-arte.js */
/* Tu Lana · Arte de temporada: OTOÑO
   Hojas "pintadas" (degradado + brillo + nervaduras), bellotas, frutos, ramas,
   capas con profundidad (fondo desenfocado + parallax), hojas cayendo con aleteo
   y hojas decorativas sobre tarjetas. Solo decoración: todo va con aria-hidden.
   Para otra temporada se crea otro archivo con la misma API (pintarTemporada). */
(function () {
  const PAL = {
    red:    ['#EE7A4E', '#B8391C', '#8E2A12'],
    orange: ['#F7A84A', '#D2601F', '#A2461A'],
    yellow: ['#F8D76A', '#E0A229', '#A8741A'],
    green:  ['#B3C46A', '#6E8A3A', '#4B6127'],
    brown:  ['#D49A5A', '#96602E', '#6B4220'],
    wine:   ['#D45A4A', '#8E2A2A', '#6A1E1E']
  };
  const SHAPES = {
    maple: { vb: '-20 -20 40 46', w: 40, h: 46,
      d: 'M0 -19 L3.2 -10.5 L8.5 -13.5 L7.4 -6.2 L15.5 -9.5 L12.4 -2.2 L18.5 0.4 L11.2 4.4 L13.4 9.6 L5.4 7.6 L2.2 13.2 L0 10.4 L-2.2 13.2 L-5.4 7.6 L-13.4 9.6 L-11.2 4.4 L-18.5 0.4 L-12.4 -2.2 L-15.5 -9.5 L-7.4 -6.2 L-8.5 -13.5 L-3.2 -10.5 Z',
      veins: 'M0 11 V-15 M0 3 L11 -7 M0 3 L-11 -7 M0 7.5 L12.5 3 M0 7.5 L-12.5 3', stem: 'M0 10 Q1.4 17 -0.8 25' },
    oak: { vb: '-13 -21 26 48', w: 26, h: 48,
      d: 'M0 -19 C5 -18 3.6 -12 7.6 -10.4 C12.4 -8.6 7 -3.6 10.6 -0.8 C14 2 7.4 4.6 8.6 8.6 C9.4 12.6 3.4 13 1.6 17 L0 18 L-1.6 17 C-3.4 13 -9.4 12.6 -8.6 8.6 C-7.4 4.6 -14 2 -10.6 -0.8 C-7 -3.6 -12.4 -8.6 -7.6 -10.4 C-3.6 -12 -5 -18 0 -19 Z',
      veins: 'M0 16 V-16 M0 -8 L6 -10 M0 -8 L-6 -10 M0 -1 L8 -1.5 M0 -1 L-8 -1.5 M0 6 L7 8 M0 6 L-7 8', stem: 'M0 17 Q0.8 22 -0.6 26' },
    simple: { vb: '-10 -19 20 44', w: 20, h: 44,
      d: 'M0 -18 C9 -10 10 6 0 18 C-10 6 -9 -10 0 -18 Z',
      veins: 'M0 16 V-15 M0 -7 L5 -10 M0 -7 L-5 -10 M0 0 L6 -3 M0 0 L-6 -3 M0 7 L5.5 4 M0 7 L-5.5 4', stem: 'M0 17 Q0.8 21 -0.4 24' }
  };

  function defs() {
    let s = '<radialGradient id="lfHL" cx=".32" cy=".22" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>';
    for (const [c, [a, b]] of Object.entries(PAL))
      s += `<linearGradient id="lfG-${c}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
    s += '<linearGradient id="barkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6A40"/><stop offset="1" stop-color="#4E3018"/></linearGradient>'
       + '<radialGradient id="berryG" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#F27A5E"/><stop offset=".6" stop-color="#C33A22"/><stop offset="1" stop-color="#7E1E10"/></radialGradient>'
       + '<linearGradient id="acornG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0A866"/><stop offset="1" stop-color="#8A5428"/></linearGradient>'
       + '<linearGradient id="capG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5A30"/><stop offset="1" stop-color="#4E2F16"/></linearGradient>';
    for (const [k, sh] of Object.entries(SHAPES))
      for (const [c, p] of Object.entries(PAL))
        s += `<symbol id="lf-${k}-${c}" viewBox="${sh.vb}">
          <path d="${sh.d}" fill="url(#lfG-${c})" stroke="${p[2]}" stroke-width=".9" stroke-linejoin="round"/>
          <path d="${sh.d}" fill="url(#lfHL)"/>
          <path d="${sh.veins}" stroke="${p[2]}" stroke-opacity=".5" stroke-width="1" fill="none" stroke-linecap="round"/>
          <path d="${sh.stem}" stroke="#6E4422" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>`;
    s += `<symbol id="acorn2" viewBox="0 0 24 32">
        <path d="M12 9 L13 2.5" stroke="#5A361A" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="12" cy="20.5" rx="8" ry="10" fill="url(#acornG)"/>
        <ellipse cx="9" cy="19" rx="2.2" ry="5" fill="#fff" opacity=".28"/>
        <path d="M12 30 L12 31.5" stroke="#6B4220" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M2.5 13 Q12 3.5 21.5 13 Q12 16.5 2.5 13Z" fill="url(#capG)"/>
        <path d="M5 11.5 l3 2 M8.5 9 l3 3 M12.5 8.5 l3 3.4 M16.5 9.5 l2.6 2.6 M7 13 l2-2.4 M11 13.8 l2.4-3 M15 13.6 l2.4-2.6" stroke="#2E1A0A" stroke-opacity=".35" stroke-width=".9"/></symbol>`;
    s += `<symbol id="berry2" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="url(#berryG)"/><circle cx="7" cy="6.5" r="2.2" fill="#fff" opacity=".6"/><path d="M10 1.8 l-1.2 -1.6 M10 1.8 l1.4 -1.4" stroke="#4E3018" stroke-width="1"/></symbol>`;
    return s;
  }

  const L = (shape, color, x, y, size, rot, extra = '') => {
    const sh = SHAPES[shape], h = size * sh.h / sh.w;
    return `<use href="#lf-${shape}-${color}" x="${x - size / 2}" y="${y - h / 2}" width="${size}" height="${h}" transform="rotate(${rot} ${x} ${y})" ${extra}/>`;
  };
  const A = (x, y, s, rot = 0) => `<use href="#acorn2" x="${x}" y="${y}" width="${s}" height="${s * 1.33}" transform="rotate(${rot} ${x + s / 2} ${y + s / 2})"/>`;
  const B = (x, y, s) => `<use href="#berry2" x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}"/>`;
  const branch = (d, w) => `<path d="${d}" stroke="url(#barkG)" stroke-width="${w}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-opacity=".16" stroke-width="${Math.max(1, w / 4)}" fill="none" stroke-linecap="round" transform="translate(-1 -1.4)"/>`;

  /* ---------- Escenas ---------- */
  const SCENE = {
    top: `<svg class="art-top" viewBox="0 0 340 230" aria-hidden="true">
      ${branch('M345 26 C290 30 250 58 205 52 C160 46 128 74 70 66 C50 63 36 70 22 80', 8)}
      ${branch('M232 50 C222 82 208 104 186 128', 5)}
      ${branch('M150 56 C146 40 152 26 164 16', 3.5)}
      ${branch('M96 68 C92 86 98 100 108 112', 3)}
      ${L('maple', 'orange', 268, 30, 54, 18)}${L('oak', 'yellow', 172, 32, 34, -32)}${L('simple', 'green', 112, 78, 22, 40)}
      ${L('maple', 'red', 192, 128, 48, -14)}${L('oak', 'brown', 300, 58, 30, 52)}${L('simple', 'yellow', 236, 74, 24, -20)}
      ${L('maple', 'yellow', 58, 88, 38, -40)}${L('oak', 'orange', 140, 104, 28, 18)}${L('simple', 'green', 322, 22, 22, -60)}
      ${L('maple', 'wine', 228, 6, 34, 120)}${L('simple', 'orange', 30, 72, 20, -80)}
      ${B(206, 82, 15)}${B(219, 89, 13)}${B(199, 95, 13)}${B(213, 101, 11)}
      ${A(126, 60, 22, -8)}${A(256, 66, 18, 14)}</svg>`,
    left: `<svg class="art-left" viewBox="0 0 190 230" aria-hidden="true">
      ${branch('M-6 214 C40 180 64 140 96 70', 6)}${branch('M62 132 C86 124 104 128 122 140', 3)}
      ${L('maple', 'yellow', 98, 50, 50, -18)}${L('oak', 'orange', 46, 116, 32, 28)}${L('simple', 'green', 80, 150, 24, 64)}
      ${L('maple', 'red', 128, 140, 34, 20)}${L('oak', 'brown', 24, 176, 26, -24)}${B(66, 104, 12)}${B(76, 98, 10)}
      ${A(10, 152, 22, -12)}</svg>`,
    back: `<svg class="art-back" viewBox="0 0 370 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g filter="url(#softBlur)" opacity=".55">
        ${L('maple', 'red', -10, 300, 130, 30)}${L('oak', 'yellow', 360, 470, 96, -30)}${L('simple', 'green', 350, 190, 70, 50)}
        ${L('maple', 'orange', 10, 640, 120, -20)}${L('oak', 'brown', 330, 720, 90, 40)}</g>
      <defs><filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs></svg>`,
    hero: `<svg viewBox="0 0 150 150" aria-hidden="true">
      ${branch('M160 10 C120 18 104 40 84 44', 5)}${branch('M118 22 C116 48 104 64 92 80', 3)}
      ${L('maple', 'orange', 122, 40, 52, 24)}${L('oak', 'yellow', 70, 50, 30, -40)}${L('maple', 'red', 98, 90, 40, -12)}
      ${L('simple', 'green', 140, 76, 22, 30)}${B(104, 58, 13)}${B(115, 63, 11)}${B(98, 68, 11)}${A(124, 98, 22, 10)}</svg>`,
    wreath: (() => { // corona de hojas alrededor de la dona (como en la propuesta)
      const cs = ['orange', 'yellow', 'green', 'red', 'brown', 'yellow', 'orange', 'green'];
      const shs = ['maple', 'oak', 'simple', 'maple', 'oak', 'simple', 'maple', 'oak'];
      let s = '';
      [[-150, 22], [-120, 18], [-62, 20], [-30, 16], [30, 20], [60, 16], [118, 20], [150, 18], [180, 16], [205, 18]].forEach(([deg, sz], i) => {
        const a = deg * Math.PI / 180, r = 80; s += L(shs[i % 8], cs[i % 8], 85 + r * Math.cos(a), 85 + r * Math.sin(a), sz, deg + 90);
      });
      return `<svg class="art-wreath" viewBox="0 0 170 170" aria-hidden="true">${s}${B(150, 128, 10)}${B(158, 120, 9)}${A(18, 130, 16, -20)}</svg>`;
    })(),
    stick: {
      tr: () => `<svg class="art-stick tr" viewBox="0 0 80 70" aria-hidden="true">${L('maple', 'orange', 50, 26, 40, 30)}${L('oak', 'yellow', 26, 18, 22, -40)}${B(36, 40, 10)}</svg>`,
      tl: () => `<svg class="art-stick tl" viewBox="0 0 80 70" aria-hidden="true">${L('oak', 'red', 30, 26, 26, -30)}${L('simple', 'green', 52, 18, 18, 40)}</svg>`,
      br: () => `<svg class="art-stick br" viewBox="0 0 80 70" aria-hidden="true">${L('maple', 'yellow', 44, 40, 36, -20)}${A(16, 30, 16, 12)}</svg>`,
      bl: () => `<svg class="art-stick bl" viewBox="0 0 80 70" aria-hidden="true">${L('maple', 'red', 34, 38, 34, 15)}${L('simple', 'yellow', 58, 46, 18, 70)}</svg>`
    }
  };

  function falling(n) {
    const kinds = [['maple', 'orange'], ['oak', 'yellow'], ['simple', 'green'], ['maple', 'red'], ['oak', 'brown'], ['maple', 'yellow'], ['simple', 'orange']];
    return Array.from({ length: n }, (_, i) => {
      const [sh, c] = kinds[i % kinds.length], near = i % 4 === 3, size = near ? 34 : 16 + (i * 7) % 12;
      return `<span class="fall2${near ? ' near' : ''}" style="left:${(i * 37) % 92 + 2}%;width:${size}px;animation-duration:${(near ? 9 : 13) + (i % 5) * 2.4}s;animation-delay:-${(i * 2.7).toFixed(1)}s">
        <span class="flut" style="animation-duration:${2.2 + (i % 3) * .7}s"><svg viewBox="${SHAPES[sh].vb}"><use href="#lf-${sh}-${c}"/></svg></span></span>`;
    }).join('');
  }

  ARTE.registrar('otono', {
    defs: defs(),
    escena: () => ({
      back: SCENE.back, top: SCENE.top, left: SCENE.left, falls: falling(12), ground: '',
      hero: SCENE.hero, wreath: SCENE.wreath, stick: SCENE.stick,
      page: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g filter="url(#pageBlur)" opacity=".7">
        ${L('maple', 'red', 80, 120, 220, 30)}${L('oak', 'yellow', 1130, 160, 180, -30)}${L('maple', 'orange', 1100, 690, 240, 15)}
        ${L('simple', 'green', 140, 700, 150, 60)}${L('oak', 'brown', 620, -20, 160, 90)}${L('maple', 'yellow', 360, 820, 180, -40)}</g>
        <defs><filter id="pageBlur"><feGaussianBlur stdDeviation="9"/></filter></defs></svg>`
    })
  });
})();

</script>
<script>/* invierno-arte.js */
/* Tu Lana · Arte de temporada: INVIERNO
   Basado en "TuLana · Temas de temporada" (rama de pino con frutos rojos, copos y nieve al pie).
   Ramas de pino con agujas en 3 verdes y nieve encima, acebo con brillo, piñas, esferas navideñas,
   copos de nieve, montículo de nieve con pinitos, nieve que cae y corona navideña en la dona. */
(function () {
  const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const NEEDLE = ['#2E5A4C', '#3F7A62', '#5C9A7A'];

  function defs() {
    return `
      <linearGradient id="wBark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A5A44"/><stop offset="1" stop-color="#3E2C20"/></linearGradient>
      <linearGradient id="wHolly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E9A6C"/><stop offset="1" stop-color="#1C4A33"/></linearGradient>
      <radialGradient id="wHL" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="wBerry" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#F27474"/><stop offset=".6" stop-color="#B8323A"/><stop offset="1" stop-color="#6E1218"/></radialGradient>
      <radialGradient id="wBallR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F58C8C"/><stop offset=".55" stop-color="#B8323A"/><stop offset="1" stop-color="#5E0F14"/></radialGradient>
      <radialGradient id="wBallG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF0B8"/><stop offset=".55" stop-color="#C9962B"/><stop offset="1" stop-color="#6E4A0C"/></radialGradient>
      <radialGradient id="wBallB" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#C9E3F2"/><stop offset=".55" stop-color="#4F86A6"/><stop offset="1" stop-color="#1F4E5F"/></radialGradient>
      <linearGradient id="wCone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B07A44"/><stop offset="1" stop-color="#5A3A1E"/></linearGradient>
      <linearGradient id="wSnow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE9F2"/></linearGradient>
      <symbol id="w-holly" viewBox="-14 -22 28 44">
        <path d="M0 -20 L4 -14 L9 -15 L7 -9 L12 -7 L8 -2 L12 3 L7 5 L9 11 L4 10 L0 20 L-4 10 L-9 11 L-7 5 L-12 3 L-8 -2 L-12 -7 L-7 -9 L-9 -15 L-4 -14 Z" fill="url(#wHolly)" stroke="#163A28" stroke-width=".8" stroke-linejoin="round"/>
        <path d="M0 -20 L4 -14 L9 -15 L7 -9 L12 -7 L8 -2 L12 3 L7 5 L9 11 L4 10 L0 20 L-4 10 L-9 11 L-7 5 L-12 3 L-8 -2 L-12 -7 L-7 -9 L-9 -15 L-4 -14 Z" fill="url(#wHL)"/>
        <path d="M0 18 V-17" stroke="#BFE0C9" stroke-opacity=".55" stroke-width="1.1"/></symbol>
      <symbol id="w-berry" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="url(#wBerry)"/><circle cx="7" cy="6.5" r="2.3" fill="#fff" opacity=".7"/><circle cx="10" cy="17" r="1" fill="#3E1010" opacity=".5"/></symbol>
      <symbol id="w-flake" viewBox="-12 -12 24 24">
        <g stroke="#A9C6DA" stroke-width="2.6" stroke-linecap="round" fill="none">${[0, 60, 120, 180, 240, 300].map(a => `<path transform="rotate(${a})" d="M0 0V-10M0 -6.5l-3 -3M0 -6.5l3 -3M0 -3.2l-2 -2M0 -3.2l2 -2"/>`).join('')}</g>
        <g stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none">${[0, 60, 120, 180, 240, 300].map(a => `<path transform="rotate(${a})" d="M0 0V-10M0 -6.5l-3 -3M0 -6.5l3 -3M0 -3.2l-2 -2M0 -3.2l2 -2"/>`).join('')}</g></symbol>
      <symbol id="w-cone" viewBox="0 0 24 34">
        <path d="M12 2 L13 0" stroke="#4E3018" stroke-width="2"/>
        <path d="M12 3 C21 6 22 18 17 26 C15 30 13 33 12 33 C11 33 9 30 7 26 C2 18 3 6 12 3Z" fill="url(#wCone)"/>
        <g stroke="#3E2614" stroke-opacity=".55" stroke-width="1.1" fill="none">${[8, 13, 18, 23, 28].map((y, r) => [-1, 0, 1].map(c => `<path d="M${12 + c * 5 - 2.5 + (r % 2) * 2.5 - 2.5} ${y} q2.5 2.6 5 0"/>`).join('')).join('')}</g>
        <path d="M6 9 C8 6 12 5 15 6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".85"/></symbol>
      ${['R', 'G', 'B'].map(c => `<symbol id="w-ball${c}" viewBox="0 0 24 32">
        <circle cx="12" cy="20" r="11" fill="url(#wBall${c})"/><ellipse cx="8" cy="15.5" rx="3.2" ry="2.2" fill="#fff" opacity=".65" transform="rotate(-30 8 15.5)"/>
        <path d="M2 20 Q12 24 22 20" stroke="#fff" stroke-opacity=".35" stroke-width="1.4" fill="none"/>
        <rect x="8.5" y="6" width="7" height="4.5" rx="1" fill="#D8B45A" stroke="#8A6A1E" stroke-width=".8"/><path d="M12 6 V0" stroke="#8A6A1E" stroke-width="1"/></symbol>`).join('')}
      <symbol id="w-tree" viewBox="0 0 40 56">
        <rect x="17" y="46" width="6" height="9" fill="#5A3A1E"/>
        <path d="M20 2 L33 20 H26 L37 34 H28 L39 47 H1 L12 34 H3 L14 20 H7 Z" fill="#2E5A4C"/>
        <path d="M20 2 L27 12 Q20 10 14 13 Z M14 20 Q20 18 27 21 L26 20 Z M12 34 Q20 31 29 35 L28 34Z M7 20 Q13 23 18 20 M3 34 Q10 37 16 33 M1 47 Q10 50 20 46 Q30 50 39 47" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></symbol>`;
  }

  /* Rama de pino generada: corteza + agujas a lo largo de los puntos + nieve encima */
  function pine(pts, w, seed, snow = true) {
    const d = 'M' + pts.map(p => p.join(' ')).join(' L');
    const n = ['', '', ''];
    let k = seed;
    for (let s = 0; s < pts.length - 1; s++) {
      const [x1, y1] = pts[s], [x2, y2] = pts[s + 1], len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1);
      for (let t = 0; t < len; t += 4.2) {
        const x = x1 + (x2 - x1) * t / len, y = y1 + (y2 - y1) * t / len;
        for (const side of [-1, 1]) {
          k++; const a = ang + side * (0.95 + rnd(k) * 0.35) + Math.PI * (rnd(k + 7) * .08), L = 10 + rnd(k + 3) * 6;
          n[k % 3] += `M${x.toFixed(1)} ${y.toFixed(1)}l${(Math.cos(a) * L).toFixed(1)} ${(Math.sin(a) * L).toFixed(1)}`;
        }
      }
    }
    return `<path d="${d}" stroke="url(#wBark)" stroke-width="${w}" fill="none" stroke-linecap="round"/>`
      + n.map((p, i) => `<path d="${p}" stroke="${NEEDLE[i]}" stroke-width="2.3" stroke-linecap="round" fill="none"/>`).join('')
      + (snow ? `<path d="${d}" stroke="url(#wSnow)" stroke-width="${w * .9}" fill="none" stroke-linecap="round" transform="translate(0 -${w * .7})" opacity=".95"/>` : '');
  }
  const U = (id, x, y, w, h, rot = 0) => `<use href="#${id}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" transform="rotate(${rot} ${x} ${y})"/>`;
  const H = (x, y, s, r) => U('w-holly', x, y, s, s * 44 / 28, r);
  const Bry = (x, y, s) => U('w-berry', x, y, s, s);
  const F = (x, y, s, r = 0) => U('w-flake', x, y, s, s, r);
  const ball = (c, x, top, len, s) => `<path d="M${x} ${top} V${top + len}" stroke="#8A6A1E" stroke-width="1"/>${U('w-ball' + c, x, top + len + s * .6, s, s * 32 / 24)}`;
  const holly = (x, y, s = 1) => H(x - 9 * s, y, 24 * s, -50) + H(x + 9 * s, y + 2 * s, 24 * s, 50) + H(x, y - 8 * s, 22 * s, 0) + Bry(x - 3 * s, y + 8 * s, 10 * s) + Bry(x + 5 * s, y + 9 * s, 9 * s) + Bry(x + 1 * s, y + 3 * s, 9 * s);

  function wreath() {
    const cx = 85, cy = 85, r = 76, n = ['', '', ''];
    let k = 900;
    for (let a = 0; a < 360; a += 5) {
      const rad = a * Math.PI / 180, x = cx + r * Math.cos(rad), y = cy + r * Math.sin(rad), tan = rad + Math.PI / 2;
      for (let j = 0; j < 3; j++) { k++; const aa = tan + (rnd(k) - .5) * 2.4, L = 7 + rnd(k + 5) * 6; n[k % 3] += `M${x.toFixed(1)} ${y.toFixed(1)}l${(Math.cos(aa) * L).toFixed(1)} ${(Math.sin(aa) * L).toFixed(1)}`; }
    }
    const dots = [30, 100, 160, 215, 300].map((a, i) => { const rad = a * Math.PI / 180; return holly(cx + r * Math.cos(rad), cy + r * Math.sin(rad), .55); }).join('');
    const bow = `<g transform="translate(${cx} ${cy + r - 2})"><path d="M0 0 C-14 -12 -24 -2 -16 6 C-10 10 -4 4 0 0Z M0 0 C14 -12 24 -2 16 6 C10 10 4 4 0 0Z" fill="#B8323A" stroke="#7E1A20" stroke-width="1"/>
      <path d="M-2 2 L-10 20 L-5 18 L-3 23 Z M2 2 L10 20 L5 18 L3 23Z" fill="#9E2A31"/><circle r="4" fill="#C9393F" stroke="#7E1A20"/></g>`;
    return `<svg class="art-wreath" viewBox="0 0 170 170" aria-hidden="true">${n.map((p, i) => `<path d="${p}" stroke="${NEEDLE[i]}" stroke-width="2.1" stroke-linecap="round" fill="none"/>`).join('')}${dots}${bow}</svg>`;
  }

  function snowfall(n) {
    return Array.from({ length: n }, (_, i) => {
      const flake = i % 5 === 0, near = i % 9 === 4, size = flake ? 14 + (i % 3) * 5 : 4 + (i * 7) % 5;

<script>/* primavera-arte.js */
/* Tu Lana · Arte de temporada: PRIMAVERA
   Basado en "TuLana · Temas de temporada" (rama con hojas tiernas y flores de 5 pétalos rosas y lavanda,
   mariposa lavanda). Ramas en flor pintadas, capullos, hojas nuevas, mariposas que vuelan aleteando,
   pétalos que caen, colina de pasto con tulipanes y margaritas, y corona de flores en la dona. */
(function () {
  const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const BF = `
        <g class="wl"><path d="M-1 -2 C-8 -16 -20 -12 -17 -3 C-15 2 -7 2 -1 0Z" fill="url(#sWingA)" stroke="#5E4B7E" stroke-width=".7"/><path d="M-1 1 C-10 3 -14 12 -7 13 C-3 13 -1 7 -1 2Z" fill="url(#sWingB)" stroke="#5E4B7E" stroke-width=".7"/>
          <circle cx="-11" cy="-6" r="2" fill="#fff" opacity=".7"/></g>
        <g class="wr"><path d="M1 -2 C8 -16 20 -12 17 -3 C15 2 7 2 1 0Z" fill="url(#sWingA)" stroke="#5E4B7E" stroke-width=".7"/><path d="M1 1 C10 3 14 12 7 13 C3 13 1 7 1 2Z" fill="url(#sWingB)" stroke="#5E4B7E" stroke-width=".7"/>
          <circle cx="11" cy="-6" r="2" fill="#fff" opacity=".7"/></g>
        <path d="M0 -6 V10" stroke="#4A3A5E" stroke-width="2.4" stroke-linecap="round"/><path d="M0 -6 Q-3 -12 -5 -13 M0 -6 Q3 -12 5 -13" stroke="#4A3A5E" stroke-width=".9" fill="none"/>`;
  const PET = { pink: ['#FDE0EA', '#E98AA8', '#C25A7E'], blush: ['#FFF0F5', '#F4B4C8', '#D58AA4'], lav: ['#EEE6FB', '#A58ED6', '#7A5BA6'], white: ['#FFFFFF', '#F6DCE6', '#D9A9BC'] };

  function defs() {
    let s = `<radialGradient id="sHL" cx=".32" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="sLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2E08A"/><stop offset="1" stop-color="#4E8A45"/></linearGradient>
      <linearGradient id="sLeaf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9CC37F"/><stop offset="1" stop-color="#3E7440"/></linearGradient>
      <linearGradient id="sBark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A2805F"/><stop offset="1" stop-color="#5E4632"/></linearGradient>
      <linearGradient id="sGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B7DB86"/><stop offset="1" stop-color="#6FA14F"/></linearGradient>
      <linearGradient id="sTulipR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F68AA6"/><stop offset="1" stop-color="#B03A62"/></linearGradient>
      <linearGradient id="sTulipY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E0A229"/></linearGradient>
      <linearGradient id="sWingA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3D6FA"/><stop offset="1" stop-color="#8C70C8"/></linearGradient>
      <linearGradient id="sWingB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCD6E3"/><stop offset="1" stop-color="#DE7C9E"/></linearGradient>`;
    for (const [c, [a, b, d]] of Object.entries(PET)) {
      s += `<radialGradient id="sPet-${c}" cx=".5" cy=".85" r=".9"><stop offset="0" stop-color="${b}"/><stop offset=".75" stop-color="${a}"/></radialGradient>`;
      const petal = 'M0 0 C-4.6 -2.4 -5.4 -8.6 -2.2 -10.8 Q0 -9.6 0 -9.2 Q0 -9.6 2.2 -10.8 C5.4 -8.6 4.6 -2.4 0 0Z';
      s += `<symbol id="s-bl-${c}" viewBox="-12 -12 24 24">${[0, 72, 144, 216, 288].map(r => `<path d="${petal}" transform="rotate(${r})" fill="url(#sPet-${c})" stroke="${d}" stroke-width=".5"/>`).join('')}
        <circle r="3.1" fill="#F7D46A"/><circle r="1.4" fill="#E0A229"/>${[0, 60, 120, 180, 240, 300].map(r => `<circle cx="${(4.2 * Math.cos(r * Math.PI / 180)).toFixed(1)}" cy="${(4.2 * Math.sin(r * Math.PI / 180)).toFixed(1)}" r=".7" fill="#C98A1E"/>`).join('')}</symbol>`;
    }
    s += `<symbol id="s-leaf" viewBox="-8 -17 16 36"><path d="M0 -16 C8 -9 8 6 0 15 C-8 6 -8 -9 0 -16Z" fill="url(#sLeaf)" stroke="#3E7440" stroke-width=".6"/><path d="M0 -16 C8 -9 8 6 0 15 C-8 6 -8 -9 0 -16Z" fill="url(#sHL)"/>
        <path d="M0 14 V-13 M0 -5 l4 -3 M0 -5 l-4 -3 M0 2 l4.5 -3 M0 2 l-4.5 -3" stroke="#3E7440" stroke-opacity=".5" stroke-width=".8" fill="none"/><path d="M0 14 V19" stroke="#5E4632" stroke-width="1.2"/></symbol>
      <symbol id="s-bud" viewBox="-5 -9 10 16"><path d="M0 -8 C4 -5 4 1 0 3 C-4 1 -4 -5 0 -8Z" fill="url(#sPet-pink)"/><path d="M-3 1 Q0 6 3 1 Q0 3 -3 1Z" fill="#6FA14F"/><path d="M0 3 V7" stroke="#5E4632" stroke-width="1"/></symbol>
      <symbol id="s-petal" viewBox="-5 -7 10 14"><path d="M0 6 C-4.4 3 -4.6 -3.6 -1.6 -6 Q0 -5 0 -4.6 Q0 -5 1.6 -6 C4.6 -3.6 4.4 3 0 6Z" fill="url(#sPet-pink)"/></symbol>
      <symbol id="s-daisy" viewBox="-11 -11 22 22">${Array.from({ length: 12 }, (_, i) => `<ellipse cx="0" cy="-6" rx="2.2" ry="5" fill="#FFFFFF" stroke="#E6DCC8" stroke-width=".5" transform="rotate(${i * 30})"/>`).join('')}<circle r="3.4" fill="#F7C842"/><circle r="3.4" fill="url(#sHL)"/></symbol>
      ${['R', 'Y'].map(c => `<symbol id="s-tulip${c}" viewBox="0 0 20 44"><path d="M10 18 V44" stroke="#4E8A45" stroke-width="2"/><path d="M10 40 C3 34 2 26 5 22 C8 28 9 34 10 40Z" fill="url(#sLeaf2)"/>
        <path d="M3 8 L6 3 L10 7 L14 3 L17 8 C18 15 15 20 10 20 C5 20 2 15 3 8Z" fill="url(#sTulip${c})"/><path d="M6 8 C7 14 9 17 10 18" stroke="#fff" stroke-opacity=".4" stroke-width="1.2" fill="none"/></symbol>`).join('')}
      <symbol id="s-bfly" viewBox="-20 -16 40 32">${BF}</symbol>`;
    return s;
  }

  const U = (id, x, y, w, h, rot = 0) => `<use href="#${id}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" transform="rotate(${rot} ${x} ${y})"/>`;
  const BL = (c, x, y, s, r = 0) => U('s-bl-' + c, x, y, s, s, r);
  const LF = (x, y, s, r) => U('s-leaf', x, y, s * 16 / 36, s, r);
  const BD = (x, y, s, r) => U('s-bud', x, y, s * 10 / 16, s, r);
  const branch = (d, w) => `<path d="${d}" stroke="url(#sBark)" stroke-width="${w}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-opacity=".18" stroke-width="${Math.max(1, w / 4)}" fill="none" stroke-linecap="round" transform="translate(-1 -1.3)"/>`;
  const bfly = (x, y, s, r = 0) => U('s-bfly', x, y, s, s * .8, r);
  // racimo de flores en un punto de la rama
  const cluster = (x, y, k, s = 1) => {
    const cs = ['pink', 'blush', 'lav', 'white'];
    s *= 1.35;
    return LF(x - 10 * s, y + 6 * s, 22 * s, -60 + rnd(k) * 30) + LF(x + 12 * s, y + 4 * s, 20 * s, 60 - rnd(k + 1) * 30)
      + BL(cs[k % 4], x, y, 20 * s, rnd(k + 2) * 70) + BL(cs[(k + 1) % 4], x + 11 * s, y - 7 * s, 15 * s, rnd(k + 3) * 70) + BD(x - 9 * s, y - 9 * s, 12 * s, -30);
  };

  function wreath() {
    const cx = 85, cy = 85, r = 77;
    let vine = '', items = '';
    vine = `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="#5E9447" stroke-width="2.4" fill="none" stroke-dasharray="14 4"/>`;
    for (let a = 0; a < 360; a += 24) {
      const rad = a * Math.PI / 180, x = cx + r * Math.cos(rad), y = cy + r * Math.sin(rad);
      items += LF(x, y, 16, a + (a % 48 ? 40 : -40));
    }
    const cs = ['pink', 'lav', 'blush', 'pink', 'white', 'lav'];
    [20, 80, 140, 200, 260, 320].forEach((a, i) => { const rad = a * Math.PI / 180; items += BL(cs[i], cx + r * Math.cos(rad), cy + r * Math.sin(rad), 18, a); });
    [50, 170, 290].forEach(a => { const rad = a * Math.PI / 180; items += U('s-daisy', cx + r * Math.cos(rad), cy + r * Math.sin(rad), 14, 14); });
    return `<svg class="art-wreath" viewBox="0 0 170 170" aria-hidden="true">${vine}${items}${bfly(150, 20, 22, 20)}</svg>`;
  }

  function petals(n) {
    let s = Array.from({ length: n }, (_, i) => {
      const near = i % 8 === 5, size = near ? 18 : 8 + (i * 5) % 6;
      return `<span class="fall2${near ? ' near' : ''}" style="left:${(i * 31) % 94 + 2}%;width:${size}px;animation-duration:${12 + (i % 5) * 2.6}s;animation-delay:-${(i * 2.1).toFixed(1)}s">
        <span class="flut" style="animation-duration:${2.4 + (i % 3) * .7}s"><svg viewBox="-5 -7 10 14"><use href="#s-petal"/></svg></span></span>`;

    s += [[140, 18, 0], [420, 24, -9]].map(([top, dur, del]) => `<span class="fly" style="top:${top}px;animation-duration:${dur}s;animation-delay:${del}s"><svg viewBox="-20 -16 40 32">${BF}</svg></span>`).join('');

  ARTE.registrar('primavera', {

      top: `<svg class="art-top" viewBox="0 0 340 230" aria-hidden="true">
        ${branch('M352 24 C300 30 258 56 208 52 C162 48 128 74 72 68 C52 66 38 72 24 82', 7)}${branch('M236 52 C226 84 210 106 188 130', 4.5)}
        ${branch('M152 58 C148 42 154 28 166 18', 3)}${branch('M98 70 C94 88 100 102 110 114', 2.6)}
        ${cluster(270, 34, 1, 1.15)}${cluster(212, 56, 2, 1.05)}${cluster(166, 22, 3, .9)}${cluster(190, 128, 4, 1)}${cluster(110, 112, 5, .85)}
        ${cluster(70, 72, 6, .95)}${cluster(318, 30, 7, .8)}${cluster(138, 70, 8, .8)}${cluster(32, 82, 9, .7)}
        ${bfly(56, 132, 30, -15)}</svg>`,
      left: `<svg class="art-left" viewBox="0 0 190 230" aria-hidden="true">
        ${branch('M-6 214 C40 180 64 140 96 70', 6)}${branch('M62 132 C86 124 104 128 122 140', 3)}
        ${cluster(96, 66, 11, 1.1)}${cluster(50, 150, 12, .9)}${cluster(122, 140, 13, .85)}${cluster(76, 108, 14, .7)}</svg>`,
      ground: `<svg class="art-ground" viewBox="0 0 370 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 42 Q70 20 150 36 T290 32 T370 28 V90 H0Z" fill="#CFE5B0" opacity=".8"/>
        <path d="M0 54 Q80 34 160 48 T300 44 T370 42 V90 H0Z" fill="url(#sGrass)"/>
        ${Array.from({ length: 40 }, (_, i) => { const x = i * 9.4 + rnd(i) * 5, h = 6 + rnd(i + 50) * 8; return `<path d="M${x.toFixed(1)} 56 q${(rnd(i + 9) * 4 - 2).toFixed(1)} -${h.toFixed(1)} ${(rnd(i + 3) * 6 - 3).toFixed(1)} -${(h + 3).toFixed(1)}" stroke="#6FA14F" stroke-width="1.6" fill="none" stroke-linecap="round"/>`; }).join('')}
        ${U('s-tulipR', 24, 30, 14, 31)}${U('s-tulipY', 38, 34, 12, 27)}${U('s-tulipR', 330, 28, 14, 31)}${U('s-tulipY', 346, 33, 12, 27)}
        ${U('s-daisy', 64, 46, 12, 12)}${U('s-daisy', 300, 44, 12, 12)}${U('s-daisy', 314, 50, 9, 9)}</svg>`,
      falls: petals(22),
      hero: `<svg viewBox="0 0 150 150" aria-hidden="true">${branch('M160 10 C120 18 104 40 84 44', 5)}${branch('M118 22 C116 48 104 64 92 80', 3)}
        ${cluster(124, 36, 21, 1.2)}${cluster(90, 46, 22, 1)}${cluster(98, 84, 23, 1.05)}${bfly(130, 100, 28, 15)}</svg>`,
      wreath: wreath(),
      stick: {
        tr: () => `<svg class="art-stick tr" viewBox="0 0 80 70" aria-hidden="true">${cluster(42, 32, 31, 1.1)}</svg>`,
        tl: () => `<svg class="art-stick tl" viewBox="0 0 80 70" aria-hidden="true">${bfly(40, 34, 40, -15)}</svg>`,
        br: () => `<svg class="art-stick br" viewBox="0 0 80 70" aria-hidden="true">${U('s-tulipR', 32, 34, 18, 40)}${U('s-tulipY', 50, 38, 16, 35)}</svg>`,
