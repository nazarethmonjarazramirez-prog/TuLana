<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF1EF">
<title>TuLana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 460px), barra de navegación fija abajo, tarjetas solo donde marcan un objeto. */
:root{
  --bg:#EAF1EF; --surface:#FFFFFF; --sunk:#DCE7E4; --ink:#0E2925; --muted:#5A716C; --line:#C9D9D5;
  --accent:#FF5C8A; --accent-ink:#FFFFFF; --mint:#18A877; --mint-soft:#CDEFE2;
  --glass:rgba(210,236,231,.55); --glass-edge:#7FA9A1; --liquid:#22B886; --liquid-2:#7FE0BC; --shine:rgba(255,255,255,.75);
  --warn:#A86200; --warn-soft:#FFF1D6; --bad:#C62A3A; --bad-soft:#FFE1E4; --good:#138A5E; --imp:#6D3FE0; --imp-soft:#EDE6FD;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A18; --surface:#13282498; --sunk:#0F2421; --ink:#E5F2EF; --muted:#8FA8A2; --line:#24403B;
  --accent:#FF7FA2; --accent-ink:#2A0712; --mint:#3CD39C; --mint-soft:#123A2E;
  --glass:rgba(120,190,176,.12); --glass-edge:#5E8E85; --liquid:#1FA97A; --liquid-2:#3FD7A1; --shine:rgba(255,255,255,.28);
  --warn:#F2B04A; --warn-soft:#3A2A0C; --bad:#FF7A86; --bad-soft:#3D1218; --good:#3CD39C; --imp:#B79BFF; --imp-soft:#2A2145; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1A18; --surface:#13282498; --sunk:#0F2421; --ink:#E5F2EF; --muted:#8FA8A2; --line:#24403B;
  --accent:#FF7FA2; --accent-ink:#2A0712; --mint:#3CD39C; --mint-soft:#123A2E;
  --glass:rgba(120,190,176,.12); --glass-edge:#5E8E85; --liquid:#1FA97A; --liquid-2:#3FD7A1; --shine:rgba(255,255,255,.28);
  --warn:#F2B04A; --warn-soft:#3A2A0C; --bad:#FF7A86; --bad-soft:#3D1218; --good:#3CD39C; --imp:#B79BFF; --imp-soft:#2A2145; color-scheme:dark }

html,body{min-height:100%;margin:0}
body{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.app{max-width:460px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800} h2{font-size:22px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px} .stack.lg{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 20px;font:600 15px var(--body);cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%} .btn.sm{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);font:500 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;box-sizing:border-box}
textarea{font-family:var(--mono);font-size:13px;min-height:140px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--mint-soft);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-size:24px;font-weight:800}
.lvl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
nav.tabs .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{background:none;border:0;color:var(--muted);font:600 11.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab.fab span.ring{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent)}
.tab.fab svg{width:26px;height:26px}

/* Donut */
.donut-wrap{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr}.donut{max-width:220px}.legend{display:grid;grid-template-columns:1fr 1fr;column-gap:4px}}
.donut{width:100%;max-width:200px;aspect-ratio:1;justify-self:center}
.donut circle.slice{cursor:pointer;transition:stroke-width .2s, opacity .2s}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:6px 8px;border-radius:10px;color:var(--ink);font:500 14px var(--body);text-align:left;cursor:pointer}
.legend button span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend button[aria-pressed="true"]{background:var(--sunk)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 0;font:600 13.5px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar.over>i{background:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 13px var(--display);color:#fff}

.nudge{background:var(--ink);color:var(--bg);border:0}
.nudge .label{color:inherit;opacity:.7}

/* Pig */
.pig{width:100%;max-width:330px;display:block;margin:0 auto;overflow:visible}
.pig .wave{animation:wave 5.5s linear infinite}
.pig .wave.back{animation-duration:8s;animation-direction:reverse;opacity:.55}
.pig .level{transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes wave{to{transform:translateX(-160px)}}
.pig .coin-drop{animation:drop 1s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--fall));opacity:0}}
.pig.bounce{animation:bounce .6s ease}
@keyframes bounce{30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.02)}}
.pct{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms{border-radius:14px;padding:10px 6px;text-align:center;background:var(--sunk);font:700 15px var(--display);color:var(--muted)}
.ms.on{background:var(--mint-soft);color:var(--good)}
.ms small{display:block;font:500 11px var(--body)}

/* Onboarding */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:22px;padding-top:6px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.onb .q{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;text-wrap:balance}
.onb .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.rowedit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.rowedit.acc{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) auto}
@media (max-width:400px){.rowedit.acc{grid-template-columns:1fr 1fr auto}.rowedit.acc .typ{grid-column:1/3}}
.x{border:0;background:var(--sunk);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.sumbox{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sumbox .row{justify-content:space-between}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}

/* Scan */
.drop{border:2px dashed var(--glass-edge);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--glass);cursor:pointer}
.drop svg{width:44px;height:44px;color:var(--accent)}
.scanning{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk);min-height:220px;display:grid;place-items:center}
.scanning img{max-height:320px;object-fit:contain;opacity:.85}
.scanning .beam{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 4px var(--accent);animation:beam 1.8s ease-in-out infinite alternate}
@keyframes beam{from{top:6%}to{top:92%}}
.item{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:12px;border-radius:14px;background:var(--sunk);position:relative}
.item.review{background:var(--warn-soft);outline:1.5px solid var(--warn)}
.item .raw{grid-column:1/-1;font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.item input,.item select{padding:9px 10px;font-size:15px}
.item .cat{grid-column:1/2}
.item .del{position:absolute;top:8px;right:8px;width:28px;height:28px;font-size:15px}
.item .namefld{padding-right:36px}
.warnings{display:flex;flex-direction:column;gap:6px}
.warnings p{font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.warnings p.bad{background:var(--bad-soft);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(420px, calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast .3s ease}
@keyframes toast{from{transform:translate(-50%,12px);opacity:0}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border-radius:14px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;opacity:.5}
.badge.on{opacity:1;background:var(--mint-soft)}
.badge b{font-family:var(--display);font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* Temporadas */
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.greet{font:700 14px var(--body);color:var(--accent);margin-top:2px}
.season{position:relative;border-radius:var(--r);overflow:hidden;background:color-mix(in srgb, var(--accent) 9%, var(--surface));border:1px solid color-mix(in srgb, var(--accent) 28%, var(--line))}
.season .garland{display:block;width:100%;height:58px}
.season-body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:8px}
.season-body .label{color:var(--accent)}
.season .x{position:absolute;top:8px;right:8px;background:var(--surface);width:30px;height:30px;font-size:16px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.stamp{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.stamp b{font:700 13.5px var(--display);color:var(--ink)}
.stamp span{font-size:12px}
.stamp.now{border-style:solid;border-color:var(--accent)}
.stamp.now span{color:var(--accent);font-weight:600}
.stamp.on{background:var(--sc);border:1.5px solid var(--sc);color:#fff}
.stamp.on b{color:#fff}
.pig .bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.toggle input{width:20px;height:20px;flex:none;padding:0;accent-color:var(--accent)}
/* Merino */
.say{display:flex;gap:10px;align-items:flex-end}
.say-av{flex:none;width:78px}
.say.sm .say-av{width:60px}
.say-av svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bubble p{margin:0;font-size:14.5px;font-weight:500;line-height:1.45}
.say.noav .bubble{border-radius:18px}
.say.hero{flex-direction:column;align-items:center;gap:6px}
.say.hero .say-av{width:min(210px, 56vw)}
.say.hero .bubble{border-radius:18px;text-align:center;flex:none;max-width:340px}
.say.hero .bubble::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.merino .blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.merino .body{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.025,1.018)}}
.merino .waving{animation:hoofwave 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:144px 128px}
@keyframes hoofwave{50%{transform:rotate(-16deg)}}
.merino .bob{animation:bob 3.2s ease-in-out infinite}
/* Colores con significado: acento = acción, rojo = problema, ámbar = revisar, violeta = gasto impulsivo */
.pill.imp{background:var(--imp-soft);color:var(--imp)}
button.pill{border:0;cursor:pointer;font:600 12.5px var(--body)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;margin:0}
.alert::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--body);color:#fff;background:var(--muted)}
.alert.bad::before{background:var(--bad)}
.alert.warn::before{background:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--sunk);color:var(--ink)}
.alert.info::before{content:"i"}
.btn.danger{background:var(--bad);color:#fff}
.money.big{font-size:34px;font-weight:500}
.calc{display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{font-size:18px}
.inline-form{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.li-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer}
.li-btn:last-child{border-bottom:0}
.card-btn{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.acc-pic{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font:600 18px var(--display);color:var(--ink)}
.legal{text-align:center;line-height:1.5}
.legal a{color:inherit;text-underline-offset:3px}
.confirm.info{background:var(--sunk)}
.photo img{width:100%;border-radius:12px;display:block}
.item.neg{background:var(--mint-soft)}
.rowedit.fixrow,.rowedit.inc{grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1fr) auto}
.rowedit.goalrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto}
@media (max-width:440px){
  .rowedit.fixrow,.rowedit.inc,.rowedit.acc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .rowedit.fixrow [data-k=name],.rowedit.inc [data-k=name],.rowedit.acc [data-k=name]{grid-column:1;grid-row:1}
  .rowedit.fixrow [data-k=amt],.rowedit.inc [data-k=amt],.rowedit.acc [data-k=balance]{grid-column:2;grid-row:1}
  .rowedit.fixrow .x,.rowedit.inc .x,.rowedit.acc .x{grid-column:3;grid-row:1}
  .rowedit.fixrow .typ,.rowedit.inc .typ,.rowedit.acc .typ{grid-column:1/3;grid-row:2}
}
/* Secciones plegables */
.fold{padding:0;gap:0}
.fold>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:10px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h3{margin:0;flex:1}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s;flex:none}
.fold[open]>summary::after{transform:rotate(-135deg)}
.fold-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
/* Chat */
.chatbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.chatbtn svg{width:20px;height:20px}
.lvl{align-items:center}
.chat{display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 330px)}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}

// ───────────────────────── Utilidades ─────────────────────────

function parseMoney(s){
  let t = String(s ?? "").replace(/[^\d.,]/g,"");
  if (/,\d{1,2}$/.test(t) && !t.includes(".")) t = t.replace(",", ".");
  t = t.replace(/,/g,"");
  const n = parseFloat(t);
  return isFinite(n) ? Math.round(n*100) : 0;
}
function parseSigned(s){ const t = String(s ?? "").trim(); const n = parseMoney(t); return /^[-−–]/.test(t) || /^\(.*\)$/.test(t) ? -n : n; }
// Escribe miles con coma: 2,500 · 1,250,000.50
const groupMoney = v => { const s = String(v ?? ""), neg = /^\s*[-−–]/.test(s), t = s.replace(/[^\d.]/g, ""), dot = t.indexOf(".");
  let i = (dot < 0 ? t : t.slice(0, dot)).replace(/^0+(?=\d)/, ""), d = dot < 0 ? null : t.slice(dot + 1).replace(/\./g, "").slice(0, 2);
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (neg ? "-" : "") + i + (d != null ? "." + d : ""); };

function getKey(){ try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } }

// Servidor de IA de TuLana: lo llena GitHub al compilar (variables TULANA_SERVER y TULANA_TOKEN del repositorio)
const SERVER_URL = "__TULANA_SERVER__", SERVER_TOKEN = "__TULANA_TOKEN__";
const hasServer = () => SERVER_URL.startsWith("https://") && !SERVER_URL.includes("__TULANA");
const aiAvailable = () => !!getKey() || hasServer();
async function callServer(body, signal){
  let res;
  try {
    res = await fetch(SERVER_URL, { method:"POST", signal, headers:{ "content-type":"application/json", "x-tulana-device": deviceId(), ...(cuenta()?.token ? { authorization: "Bearer " + cuenta().token } : {}), ...(SERVER_TOKEN && !SERVER_TOKEN.startsWith("__") ? { "x-tulana-token": SERVER_TOKEN } : {}) }, body: JSON.stringify(body) });
  } catch (e) { if (e?.name === "AbortError") throw { code:"cancelled" }; throw { code:"offline" }; }
  if (res.status === 429) throw { code:"rate_limited" };
  if (res.status === 401) throw { code:"server_auth" };
  if (res.status >= 500 || !res.ok) { let c = "overloaded"; try { c = (await res.json()).error === "other" ? "other" : c; } catch {} throw { code:c }; }
  const data = await res.json();
  return String(data.text || "");
}

const GOOGLE_CLIENT_ID = "324720434530-o4do8dplmtf2acr4b47pa0sqn0e7cq52.apps.googleusercontent.com";

async function api(method, path, body){
  const c = cuenta();
  let res;
  try {
    res = await fetch(SERVER_URL.replace(/\/+$/, "") + path, { method,
      headers:{ "content-type":"application/json", ...(c?.token ? { authorization:"Bearer " + c.token } : {}) },
      body: body ? JSON.stringify(body) : undefined });
  } catch { throw { code:"offline" }; }
  let data = {}; try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== "/auth/google") {

  if (!res.ok) throw { code: data.error || "other", status: res.status };

}

// El respaldo va comprimido: ocupa unas 10 veces menos
async function packState(data){
  const json = JSON.stringify({ ...data, _real:null, demo:false });
  if (!window.CompressionStream) return "js1:" + json;
  const buf = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return "gz1:" + btoa(bin);
}
async function unpackState(str){
  if (str.startsWith("js1:")) return JSON.parse(str.slice(4));
  if (!str.startsWith("gz1:")) throw { code:"bad_backup" };
  const bin = atob(str.slice(4)), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
const realData = () => S.demo ? S._real : S;

let bkTimer = null, bkBusy = false;
function scheduleBackup(ms = 20000){ if (!cuenta()?.token) return; clearTimeout(bkTimer); bkTimer = setTimeout(() => backupNow(false), ms); }
async function backupNow(manual){
  const c = cuenta(), data = realData();
  if (!c?.token || bkBusy || !data?.onboarded || ui.chooseBackup) return;   // mientras eliges qué datos conservar, no se sube nada
  clearTimeout(bkTimer);
  if (!manual && c.subido && c.subido >= (data.updatedAt || 0)) return;
  bkBusy = true; ui.bkState = "subiendo"; paintBk();
  try {
    const r = await api("PUT", "/respaldo", { datos: await packState(data), actualizado: data.updatedAt || Date.now() });
    const cc = cuenta(); if (cc) { cc.subido = r.actualizado; cc.subidoEn = Date.now(); setCuenta(cc); }
    ui.bkState = "ok"; if (manual) toast("Respaldo guardado");
  } catch (e) {
    if (e.code === "no_session") return;
    ui.bkState = e.code === "offline" ? "offline" : "error";
    if (manual) toast(e.code === "offline" ? "Sin internet: lo respaldo cuando vuelvas a tener conexión" : "No se pudo respaldar. Lo vuelvo a intentar más tarde.");
    if (e.code === "offline") scheduleBackup(120000);
  } finally { bkBusy = false; paintBk(); }
}
function haceCuanto(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "hace un momento";
  if (m < 60) return `hace ${m} min`;
  if (m < 24 * 60) return `hace ${Math.round(m / 60)} h`;
  return new Date(t).toLocaleDateString("es-MX", { day:"numeric", month:"short" });
}
const fechaHora = t => new Date(t).toLocaleString("es-MX", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
function bkStatus(){
  const c = cuenta(); if (!c) return "";
  if (ui.bkState === "subiendo") return "Respaldando…";
  if (ui.bkState === "offline") return "Sin internet: el respaldo está pendiente.";
  if (ui.bkState === "error") return "No se pudo respaldar la última vez. Lo vuelvo a intentar solo.";
  return c.subidoEn ? `Último respaldo: ${haceCuanto(c.subidoEn)}. Se respalda solo cada vez que registras algo.` : "Se respalda solo cada vez que registras algo.";
}
function paintBk(){ const el = $("#bk-status"); if (el) el.textContent = bkStatus(); }

// Iniciar sesión con Google: Android abre el selector de cuentas y regresa una credencial
let googleCb = null;
window.__googleDone = (token, err) => { const cb = googleCb; googleCb = null; if (cb) cb(token, err); };
function googleToken(){
  return new Promise((res, rej) => {
    googleCb = (t, e) => t ? res(t) : rej({ code: String(e || "error").split(":")[0], detail: e });
    try { AndroidBridge.googleSignIn(GOOGLE_CLIENT_ID); } catch { googleCb = null; rej({ code:"error" }); }
  });
}
const LOGIN_ERR = {
  no_account: "No encontré una cuenta de Google en este teléfono. Agrégala en Ajustes → Cuentas y vuelve a intentar.",
  offline: "Necesitas internet para entrar con Google.",
  no_db: "Al servidor le falta conectar la base de datos.",
  no_google_client: "Al servidor le falta el ID de cliente de Google.",
  wrong_client: "La configuración de Google no coincide con la del servidor.",
};
async function loginGoogle(){
  if (ui.loginBusy || !cuentasOn()) return;
  ui.loginBusy = true; render();
  try {
    const idToken = await googleToken();
    const r = await api("POST", "/auth/google", { idToken });
    setCuenta({ token:r.token, email:r.usuario.email, nombre:r.usuario.nombre, foto:r.usuario.foto, subido:0, subidoEn:0 });
    ui.sesionVencida = false; ui.bkState = null;
    const local = realData(), first = (r.usuario.nombre || "").split(" ")[0];
    if (r.respaldo && !local?.onboarded) { ui.loginBusy = false; await restoreBackup(); return; }
    if (r.respaldo) { ui.chooseBackup = r.respaldo; ui.view = "profile"; toast(`Hola${first ? ", " + first : ""}. Encontré un respaldo en tu cuenta.`); }
    else if (local?.onboarded) { toast("Listo: tus datos se respaldan en tu cuenta"); backupNow(false); }
    else { if (!S.profile.name && first) S.profile.name = first; ui.onb = Math.max(ui.onb, 1); toast(`Hola${first ? ", " + first : ""}. Terminemos tu perfil.`); }
  } catch (e) {
    if (e.code !== "cancel") toast(LOGIN_ERR[e.code] || `No se pudo entrar con Google (${e.detail || e.code}).`);
  } finally { ui.loginBusy = false; render(); }
}
async function restoreBackup(){
  ui.loginBusy = true; render();
  try {
    const r = await api("GET", "/respaldo");
    if (!r.datos) throw { code:"empty" };
    const data = await unpackState(r.datos);
    S = normalizeState(Object.assign(freshState(), data)); S.demo = false; S._real = null;
    save();
    const c = cuenta(); if (c) { c.subido = S.updatedAt; c.subidoEn = Date.now(); setCuenta(c); }
    ui.chooseBackup = null; ui.onb = 0; ui.view = "home"; ui.goalId = null;
    toast(`Recuperé tus datos del ${fechaHora(r.actualizado)}`);
  } catch (e) {
    toast(e.code === "offline" ? "Necesitas internet para recuperar tu respaldo." : "No pude leer tu respaldo. Intenta de nuevo.");
  } finally { ui.loginBusy = false; render(); window.scrollTo(0, 0); }
}
async function logoutGoogle(){
  await backupNow(false);
  const c = cuenta(); setCuenta(null); ui.chooseBackup = null; ui.confirmDelAcc = false; render();
  toast("Cerraste sesión. Tus datos siguen en este teléfono.");
  try { await fetch(SERVER_URL.replace(/\/+$/, "") + "/salir", { method:"POST", headers:{ authorization:"Bearer " + c.token } }); } catch {}
}
async function deleteAccount(){
  try {
    await api("DELETE", "/cuenta");
    setCuenta(null); ui.confirmDelAcc = false; ui.chooseBackup = null; render();
    toast("Eliminé tu cuenta y tu respaldo. Tus datos siguen en este teléfono.");

}

  else if (ui.confirmDelAcc) body = `<div class="confirm"><b>¿Eliminar tu cuenta?</b>
    <p class="small">Se borran tu cuenta y tu respaldo en la nube. Tus datos siguen en este teléfono. No se puede deshacer.</p>
    <div class="row"><button class="btn sm danger" data-act="delacc">Sí, eliminar</button><button class="btn ghost sm" data-act="nodelacc">Cancelar</button></div></div>`;
  else body = `<p class="small muted" id="bk-status">${bkStatus()}</p>
    <div class="row wrap"><button class="btn soft sm" data-act="backupnow">Respaldar ahora</button><button class="btn ghost sm" data-act="logout">Cerrar sesión</button></div>
    <button class="link small" data-act="askdelacc" style="align-self:flex-start">Eliminar mi cuenta</button>`;
  return `<div class="card" id="acc-card"><div class="row between"><h3>Tu cuenta</h3><span class="pill good">Respaldo activo</span></div>
    <div class="row" style="gap:12px">${avatar}<div class="stack" style="gap:2px;min-width:0"><b>${esc(c.nombre || "Tu cuenta")}</b><span class="small muted" style="overflow-wrap:anywhere">${esc(c.email)}</span></div></div>
    ${body}
    <p class="small muted">Las fotos de los tickets no se respaldan; se quedan en este teléfono.</p></div>`;
}
function dataNote(){
  if (cuenta()) return `<p class="small muted">Tus datos se guardan en este teléfono y se respaldan en tu cuenta de Google.</p>`;

  const chars = text.replace(/\s/g,""); const valid = (chars.match(/[A-Za-zÁÉÍÓÚÑÜáéíóúñü0-9.,$:/%\-#()*]/g)||[]).length;
  const priceLines = lines.filter(l=>/\d+[.,]\d{2}\s*$/.test(l)).length;
  return (valid/Math.max(chars.length,1))*0.5 + Math.min(priceLines/3,1)*0.3 + (/\bTOTAL\b/i.test(text)?0.2:0);
}
// Reparte un monto entre los artículos positivos según su precio (para IVA, descuentos o diferencias)
function spreadAmount(items, amount){
  const pos = items.filter(i => i.total > 0), base = pos.reduce((a,i)=>a+i.total,0);
  if (!base || !amount) return;
  let used = 0; for (const i of pos) { const add = Math.round(amount * i.total / base); i.total += add; used += add; }
  pos.reduce((a,b)=>b.total>a.total?b:a).total += amount - used;
}

function guessAccount(ex){
  const accs = S.accounts || [];
  if (!accs.length) return { id:"", why:null };
  if (accs.length === 1) return { id: accs[0].id, why: null };
  if (ex.card_last4) { const a = accs.find(x => String(x.name || "").includes(ex.card_last4)); if (a) return { id:a.id, why:`la tarjeta terminada en ${ex.card_last4}` }; }

}
function buildDraft(ex, engine){

    const fixed = mem && CATS[mem] ? { cat: mem, conf: Math.max(it.conf || 0, .9) } : {};

  });

      items.push({id:uid(), name:"Descuento del ticket", raw:"", qty:1, total:-ex.discount, cat:big.cat, conf:1, review:false});
      notes.push(`Agregué el descuento del ticket (${fmt(ex.discount)}) para que el gasto sea lo que realmente pagaste.`);
    } else if (ex.tax && near(sum() + ex.tax, ex.total)) {
      spreadAmount(items, ex.tax);

  if (ex.total == null) warnings.push("No encontré el total del ticket. Si lo ves, escríbelo abajo para comprobar que todo cuadre.");

}
async function imageToBlob(file, maxDim=1600){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, maxDim/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.86));
  } finally { URL.revokeObjectURL(url); }
}

function parseJsonLoose(t){
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b+1)); } catch {} }
  throw { code:"invalid_json" };
}
async function callClaude(model, prompt, imageB64, signal){

    return parseJsonLoose(await callServer({ json:true, max_tokens:4096, messages:[{ role:"user", text: prompt + "\n\nResponde únicamente con el JSON, sin texto adicional.", image: imageB64 || null }] }, signal));
  }

  if (imageB64) content.push({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:imageB64 } });
  content.push({ type:"text", text: prompt + "\n\nResponde únicamente con el JSON, sin texto adicional." });

    res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal,
      headers:{ "content-type":"application/json", "x-api-key":getKey(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model, max_tokens:4096, messages:[{ role:"user", content }] }) });
  } catch (e) { if (e?.name === "AbortError") throw { code:"cancelled" }; throw { code:"offline" }; }
  if (res.status === 401 || res.status === 403) throw { code:"bad_key" };
  if (res.status === 429) throw { code:"rate_limited" };
  if (res.status >= 500) throw { code:"overloaded" };
  if (!res.ok) throw { code:"other" };
  const data = await res.json();
  const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  return parseJsonLoose(text);
}
function needsStronger(ex){
  if (!ex.items.length) return ex.legibility !== "ilegible";
  const doubtful = ex.items.filter(i => i.conf < 0.6).length / ex.items.length;
  const sum = ex.items.reduce((a,i)=>a+i.total,0) - (ex.discount||0);
  const ok = ex.total == null || Math.abs(sum-ex.total) <= 100 || Math.abs(sum+(ex.tax||0)-ex.total) <= 100;
  return doubtful > 0.3 || !ok;
}
async function runScan({file, text}){

  const preview = file ? URL.createObjectURL(file) : null;
  ui.scan = { status:"reading", preview, error:null };
  render();
  try {
    let ex = null, engine = "ai";
    if (text && ocrQuality(text) < 0.35) { ui.scan = {status:"unreadable", preview}; return render(); }
    if (aiAvailable() && navigator.onLine !== false) {
      ui.ctl = new AbortController();
      const img = file ? await blobToBase64(await imageToBlob(file)) : null;
      const prompt = aiPrompt(text||"");
      try {
        ex = normalizeAI(await callClaude(MODEL_FAST, prompt, img, ui.ctl.signal));
        if (getKey() && needsStronger(ex)) { try { ex = normalizeAI(await callClaude(MODEL_STRONG, prompt, img, ui.ctl.signal)); } catch (e) { if (e?.code === "cancelled") throw e; } }
      } catch (e) {
        if (e?.code === "cancelled") { ui.scan = null; return render(); }

        if (file && !window.AndroidBridge?.ocr) throw e;
        ex = null;
      }
    }
    if (!ex && file) {
      // Sin clave o sin internet: el teléfono lee el texto (ML Kit) y Merino clasifica cada producto
      const read = await deviceOCR(file);
      if (ocrQuality(read) < 0.35) { ui.scan = {status:"unreadable", preview}; return render(); }
      ex = heuristic(read); engine = "ocr";
    }
    if (!ex) { ex = heuristic(text||""); engine = "basic"; }
    if (ex.legibility === "ilegible" || !ex.items.length) { ui.scan = {status:"unreadable", preview}; return render(); }
    ui.draft = buildDraft(ex, engine);
    if (file && S.keepPhotos) { try { ui.draft.photo = await imageToBlob(file, 1280); } catch {} }
    ui.scan = null; ui.view = "review"; render();
  } catch (e) {
    ui.scan = { status:"error", preview, error: AI_ERRORS[e?.code] || "Algo falló al leer el ticket. Inténtalo otra vez o regístralo a mano." };
    render();
  }
}

}
function animatePig(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".pig .level").forEach(g => g.style.transform = `translateY(${g.dataset.target}px)`);
  }));
  if (ui.pigFrom != null) {
    const fx = $("#coinfx");

      const target = 232 - (pigPct()/100)*180;
      fx.innerHTML = `<g class="coin-drop" style="--fall:${target-40}px"><ellipse cx="154" cy="40" rx="13" ry="13" fill="#F5C542" stroke="#C99600" stroke-width="2"/><text x="154" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6500">$</text></g>`;
      const pig = $(".pig"); pig?.classList.add("bounce"); setTimeout(()=>pig?.classList.remove("bounce"), 700);
    }
    ui.pigFrom = null;
  }
}

// ---------- Calendario ----------
const D = (y, m, d) => new Date(y, m - 1, d);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
function nthWeekday(y, m, wd, n){ const first = D(y, m, 1); return D(y, m, 1 + ((wd - first.getDay() + 7) % 7) + (n - 1) * 7); }
function easterSunday(y){ // algoritmo gregoriano anónimo
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return D(y, month, day);
}
function holidayRanges(y){
  const pascua = easterSunday(y);
  const diaPadre = nthWeekday(y, 6, 0, 3);      // tercer domingo de junio
  const revolucion = nthWeekday(y, 11, 1, 3);   // tercer lunes de noviembre (El Buen Fin termina ese día, aprox.)
  return [
    ["anio_nuevo", D(y - 1, 12, 31), D(y, 1, 2)],
    ["reyes", D(y, 1, 3), D(y, 1, 6)],
    ["cuesta", D(y, 1, 7), D(y, 1, 31)],
    ["amor", D(y, 2, 7), D(y, 2, 14)],
    ["semana_santa", addDays(pascua, -7), pascua],
    ["nino", D(y, 4, 28), D(y, 4, 30)],
    ["madres", D(y, 5, 6), D(y, 5, 10)],
    ["estudiante", D(y, 5, 20), D(y, 5, 23)],
    ["padre", addDays(diaPadre, -4), diaPadre],
    ["regreso", D(y, 8, 10), D(y, 8, 31)],

  const opt = id => `<option value="${id}" ${S.themeMode === id ? "selected" : ""}>${esc(THEMES[id].name)}</option>`;
  const ref = midnight(new Date());
  return `<div class="card"><h3>Temporadas</h3>
    <p class="small muted">Los colores, la decoración, el cochinito y los retos cambian solos con las fechas festivas de México y la estación del año.</p>
    <label class="field"><span>Tema</span><select id="p-theme">
      <option value="auto" ${isPreview() ? "" : "selected"}>Automático · hoy: ${esc(auto.name)}</option>
      <optgroup label="Fechas festivas">${HOLIDAY_ORDER.map(opt).join("")}</optgroup>
      <optgroup label="Estaciones">${SEASON_ORDER.map(opt).join("")}</optgroup></select></label>
    <label class="toggle"><input type="checkbox" id="p-fx" ${S.fx !== false ? "checked" : ""}> Animación de temporada (pétalos, nieve, confeti)</label>
    <div class="stack" style="gap:2px"><span class="label">Próximas fechas</span><div class="list">${upcomingHolidays(4).map(r => {
      const d = Math.round((r.from - ref) / 864e5);
      return `<div class="li"><span class="dot" style="background:${THEMES[r.id].pal[0][3]}"></span><div style="min-width:0"><div class="t">${esc(THEMES[r.id].name)}</div><div class="small muted">${rangeLabel(r)}</div></div><span class="small muted">${d === 1 ? "mañana" : `en ${d} días`}</span></div>`;
    }).join("")}</div></div></div>`;
}

function merinoSVG({ mood = "feliz", fluff = .5, acc = null, label = "Merino" } = {}){

  const pts = Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2 + .2; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });

  const eyeArc = (x, y) => `<path d="M${x - 6} ${y + 2} Q${x} ${y - 6} ${x + 6} ${y + 2}" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const eyeShut = (x, y) => `<path d="M${x - 6} ${y} Q${x} ${y + 4} ${x + 6} ${y}" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

      front = `<g transform="rotate(-6 100 142)"><rect x="80" y="124" width="40" height="44" rx="3" fill="#fff" stroke="${M_LINE}"/><path d="M86 134 H112 M86 141 H107 M86 148 H113 M86 155 H103" stroke="#B8B0A2" stroke-width="2" stroke-linecap="round"/></g>` + hoof(80, 152) + hoof(120, 150); break;
    case "preocupado":
      eyes = `<g class="blink">${eyeOpen(L, EY, 0, .5) + eyeOpen(R, EY, 0, .5)}</g>`; mouth = MOUTH.wavy;
      brows = `<path d="M79 78.5 L93 74.5 M121 78.5 L107 74.5" stroke="${WOOL}" stroke-width="2.6" stroke-linecap="round"/>`;

    <ellipse cx="62" cy="86" rx="16" ry="8" transform="rotate(-22 62 86)" fill="${M_INK}"/><ellipse cx="63" cy="86.5" rx="9" ry="3.8" transform="rotate(-22 63 86.5)" fill="#C9A38A"/>

    <path d="M96 103.5 Q100 100.5 104 103.5 Q102 107 100 107.5 Q98 107 96 103.5Z" fill="${M_DARK}"/>
    <g fill="${WOOL}" stroke="${WOOL_EDGE}" stroke-width="2"><circle cx="86" cy="61" r="10.5"/><circle cx="114" cy="61" r="10.5"/><circle cx="100" cy="54" r="12"/></g>

    <circle cx="76" cy="104" r="6.5" fill="var(--accent)" opacity=".3"/><circle cx="124" cy="104" r="6.5" fill="var(--accent)" opacity=".3"/>
    ${eyes}${brows}${mouth}

    ${front}${extra}${acc ? merinoAccessory(acc) : ""}

}

function offlineAnswer(q){
  const T = " " + normName(q) + " ", P = S.profile, has = re => re.test(T);
  const m = spentBy("month"), cats = Object.entries(m.by).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  const mi = monthlyIn(), ms = monthlySaveTarget();
  if (has(/ (HOLA|BUENAS|QUE ONDA|HEY|BUEN DIA|QUE TAL) /)) return `¡Hola, ${P.name || ""}! Puedo decirte en qué gastas más, cuánto puedes gastar, cómo repartir tu quincena o cuánto te falta para tus metas. Elige un tema abajo o escríbeme.`;
  if (has(/ GRACIAS /)) return "¡De nada! Aquí sigo para cuando quieras revisar tus números.";
  if (has(/PUEDO GASTAR|DISPONIBLE|CUANTO TENGO|ME QUEDA|MI SALDO|DINERO TENGO/)) {
    const cs = canSpend();
    return `Este mes puedes gastar ${fmt0(cs)}.\n- Saldo en tus cuentas: ${fmt0(cashBalance())}\n- Gastos fijos por pagar: ${fmt0(fixedPendingTotal())}${creditDebt() ? `\n- Deuda de tarjeta: ${fmt0(creditDebt())}` : ""}\n- Ahorro del mes por apartar: ${fmt0(savePending())}` + (cs < 0 ? "\nTus compromisos superan tu saldo: antes de gastar más, registra ingresos que ya recibiste o revisa tus pagos." : "");
  }
  if (has(/GASTO MAS|EN QUE GASTO|SE ME VA|SE VA MI|CATEGORIA|EN QUE SE VA|MAYOR GASTO/)) {
    if (!cats.length) return "Todavía no tienes gastos este mes. Escanea tus tickets y te digo en qué se te va.";
    const tot = cats.reduce((a,[,v]) => a+v, 0);
    return `Este mes llevas ${fmt0(tot)} en gastos. Donde más gastas:\n` + cats.slice(0, 3).map(([c,v]) => `- ${CATS[c].n}: ${fmt0(v)} (${Math.round(v/tot*100)} %)`).join("\n") + `\nSi quieres bajarle a ${CATS[cats[0][0]].n.toLowerCase()}, ponle un presupuesto en Configuración y te aviso cuando vayas en 80 %.`;
  }
  if (has(/ANTOJO|IMPULS|HORMIGA|CAPRICHO/)) {
    const ant = Math.max(0, m.by.antojos || 0), tot = Math.max(1, cats.reduce((a,[,v]) => a+v, 0));
    return `Este mes llevas ${fmt0(ant)} en antojos (${Math.round(ant/tot*100)} % de tus gastos). Tres trucos que funcionan:\n- Espera 24 horas antes de una compra que no tenías planeada.\n- Lleva tu botella de agua y un snack de casa.\n- Cuando te contengas, regístralo como "antojo evitado" en el cochinito: vale más XP.`;

async function askClaude(turns, { onText, signal } = {}){
  if (!aiAvailable()) throw { code:"no_key" };
  const system = turns[0]?.content || "";
  const msgs = [];
  for (const t of turns.slice(1)) { const last = msgs[msgs.length-1]; if (last && last.role === t.role) last.content += "\n\n" + t.content; else msgs.push({ role:t.role, content:t.content }); }
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  if (!getKey()) { const text = (await callServer({ system, max_tokens:800, messages: msgs.map(x => ({ role:x.role, text:x.content })) }, signal)).trim(); onText?.(text); return text; }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal,
      headers:{ "content-type":"application/json", "x-api-key":getKey(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model: MODEL_FAST, max_tokens:800, system, messages: msgs }) });
  } catch (e) { if (e?.name === "AbortError") throw { code:"cancelled" }; throw { code:"offline" }; }
  if (res.status === 401 || res.status === 403) throw { code:"bad_key" };
  if (res.status === 429) throw { code:"rate_limited" };
  if (res.status >= 500) throw { code:"overloaded" };
  if (!res.ok) throw { code:"other" };
  const data = await res.json();
  const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("").trim();
  onText?.(text); return text;
}

async function sendChat(q){
  q = String(q || "").trim(); if (!q || ui.chatBusy) return;
  S.chat = [...(S.chat || []), { role:"user", content:q, at:new Date().toISOString() }].slice(-40);
  ui.chatBusy = true; ui.chatErr = null; save(); render();
  const turns = [{ role:"user", content: chatRules() }, ...S.chat.slice(-12).map(({ role, content }) => ({ role, content }))];
  try {
    ui.chatCtl = new AbortController();
    const text = await askClaude(turns, { signal: ui.chatCtl.signal, onText: t => {
      const el = $("#msg-live p"); if (el) { el.textContent = t; el.classList.remove("muted"); window.scrollTo(0, document.body.scrollHeight); }
    }});
    S.chat.push({ role:"assistant", content: String(text || "").trim() || "No tengo una respuesta para eso. ¿Me lo preguntas de otra forma?", at:new Date().toISOString() });
  } catch (e) {
    if (["unavailable","no_key","not_granted","offline","rate_limited","overloaded"].includes(e?.code)) {
      // Sin IA disponible: Merino contesta con sus respuestas programadas
      S.chat.push({ role:"assistant", content: offlineAnswer(q), offline:true, at:new Date().toISOString() });
      if (e.code === "offline") ui.chatErr = "Sin internet: te respondí en modo rápido.";
      if (e.code === "rate_limited" || e.code === "overloaded") ui.chatErr = "La IA está ocupada en este momento: te respondí en modo rápido.";
    } else {
      if (e?.text) S.chat.push({ role:"assistant", content: e.text, at:new Date().toISOString() });
      if (e?.code !== "cancelled") ui.chatErr = CHAT_ERRORS[e?.code] || "No pude responder en este momento. Intenta otra vez.";
    }
  } finally {
    ui.chatBusy = false; save(); render();
  }
}

const PhotoDB = (() => {
  let dbp = null;
  const open = () => dbp ||= new Promise((res, rej) => {
    try { const r = indexedDB.open("tulana-fotos", 1); r.onupgradeneeded = () => r.result.createObjectStore("fotos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("fotos", mode); const q = fn(t.objectStore("fotos")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
  return { put: (id, blob) => run("readwrite", s => s.put(blob, id)), get: id => run("readonly", s => s.get(id)), del: id => run("readwrite", s => s.delete(id)) };
})();

// Pide al teléfono que lea el texto de la foto con ML Kit (sin internet). Solo existe dentro del APK.
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
async function deviceOCR(file){
  if (!window.AndroidBridge?.ocr) throw { code:"no_ocr" };
  const b64 = await blobToB64(await imageToBlob(file, 2000));
  return new Promise((res, rej) => {
    const id = uid(), cbs = (window.__ocrCbs ||= {});
    const timer = setTimeout(() => { delete cbs[id]; rej({ code:"ocr_fail" }); }, 40000);
    cbs[id] = { res, rej, timer };
    window.__ocrDone = (i, text, err) => { const c = cbs[i]; if (!c) return; clearTimeout(c.timer); delete cbs[i]; err ? c.rej({ code:"ocr_fail" }) : c.res(text || ""); };
    try { window.AndroidBridge.ocr(b64, id); } catch { clearTimeout(timer); delete cbs[id]; rej({ code:"no_ocr" }); }
  });
}

const PERIODS = {day:"Hoy",week:"Semana",month:"Mes",year:"Año"};
function donut(by, total){
  const entries = Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const pos = entries.reduce((a,[,v])=>a+v,0);
  const r = 80, C = 2*Math.PI*r; let acc = 0;
  const slices = entries.map(([cat,v]) => {
    const len = pos ? v/pos*C : 0; const gap = entries.length>1 ? Math.min(3, len*0.3) : 0;
    const sel = ui.selCat===cat, dim = ui.selCat && !sel;
    const s = `<circle class="slice" data-act="selcat" data-cat="${cat}" r="${r}" cx="110" cy="110" fill="none" stroke="${CATS[cat].c}" stroke-width="${sel?34:28}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}" opacity="${dim?.35:1}"><title>${CATS[cat].n}: ${fmt(v)}</title></circle>`;
    acc += len; return s;
  }).join("");
  const center = ui.selCat && by[ui.selCat] != null ? [CATS[ui.selCat].n, by[ui.selCat], pos ? Math.round(by[ui.selCat]/pos*100)+" %" : ""] : ["Gastaste", total, PERIODS[ui.period]];
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="Gastos por categoría">
    <circle r="${r}" cx="110" cy="110" fill="none" stroke="var(--sunk)" stroke-width="28"/>
    <g transform="rotate(-90 110 110)">${slices}</g>
    <text x="110" y="96" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(center[0])}</text>
    <text x="110" y="122" text-anchor="middle" font-size="${fmt0(center[1]).length>8?20:24}" font-weight="700" fill="var(--ink)" font-family="DM Mono, monospace">${fmt0(center[1])}</text>
    <text x="110" y="142" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(center[2])}</text></svg>`;
}
function nudge(){
  const w = spentBy("week"); const ant = Math.max(0, w.by.antojos||0); const share = w.total > 0 ? ant/w.total : 0;
  const rest = savePending();
  const btn = (label, v) => `<button class="btn accent sm" data-act="go" data-v="${v}" style="align-self:flex-start">${label}</button>`;
  if (canSpend() < 0) return mascotRow("preocupado", say("overspend"), {cta: S.fixed.length ? `<button class="btn accent sm" data-act="openmonth" style="align-self:flex-start">Ver gastos fijos</button>` : ""});
  const soon = fixedPending().map(f => ({ f, d: dueInfo(f) })).filter(x => x.d.days != null && x.d.days <= 3).sort((a,b) => a.d.days - b.d.days)[0];
  if (soon) return mascotRow(soon.d.days < 0 ? "preocupado" : "piensa", say(soon.d.days < 0 ? "fixed_late" : "fixed_due", { n: soon.f.name, cuando: soon.d.txt.split(" · ")[0].toLowerCase(), x: fmt0(soon.f.amt) }),
    { cta: `<button class="btn accent sm" data-act="openmonth" style="align-self:flex-start">Ver mis pagos</button>` });
  if (share > 0.15 && ant > 0) return mascotRow("preocupado", say("impulse", {p: Math.round(share*100)}), {cta: btn("Registrar un antojo evitado", "pig")});
  if (S.streak.last !== dayKey()) return mascotRow("piensa", S.streak.cur ? say("streak_risk", {n: S.streak.cur}) : say("streak_start"), {cta: btn("Escanear ticket", "scan")});
  if (rest > 0) return mascotRow("feliz", say("month_left", {x: fmt0(rest)}), {cta: btn("Aportar al cochinito", "pig")});
  return mascotRow("celebra", say("month_done"));
}

// ---------- Movimientos ----------
function viewHistory(){
  const moves = [...S.receipts.map(r => ({ at:r.at, html:receiptRow(r), out:r.total, inn:0 })), ...(S.incomes||[]).map(i => ({ at:i.at, html:incomeRow(i), out:0, inn:i.amt }))]
    .sort((a,b)=>new Date(b.at)-new Date(a.at));
  const groups = {};
  for (const m of moves) { const k = new Date(m.at).toLocaleDateString("es-MX",{month:"long",year:"numeric"}); (groups[k] ||= []).push(m); }
  return `${header("Movimientos")}
  ${moves.length ? Object.entries(groups).map(([k,list])=>{ const out = list.reduce((a,m)=>a+m.out,0), inn = list.reduce((a,m)=>a+m.inn,0);
    return `<div class="card"><div class="row between"><h3>${esc(k.charAt(0).toUpperCase() + k.slice(1))}</h3><span class="small muted">Gastaste <b class="money">${fmt0(out)}</b>${inn ? ` · Recibiste <b class="money" style="color:var(--good)">${fmt0(inn)}</b>` : ""}</span></div><div class="list">${list.map(m=>m.html).join("")}</div></div>`; }).join("")

}

// ---------- Escanear ----------
function viewScan(){
  const sc = ui.scan;
  if (sc?.status === "reading") return `${header("Escanear")}
    <div class="scanning">${sc.preview ? `<img src="${sc.preview}" alt="Tu ticket">` : `<p class="muted">Leyendo texto…</p>`}<div class="beam"></div></div>
    ${mascotRow("lee", say("scan_reading"))}
    <div class="stack" style="align-items:center;text-align:center"><p class="small muted">${aiAvailable() ? "La IA está identificando cada producto y su categoría. Suele tardar entre 5 y 30 segundos." : "Estoy leyendo el ticket aquí en tu teléfono y clasificando cada producto. Tarda unos segundos."}</p>
    <button class="btn ghost sm" data-act="cancelscan">Cancelar</button></div>`;
  if (sc?.status === "unreadable") return `${header("Escanear")}
    ${mascotRow("preocupado", say("scan_unreadable"))}
    <div class="card"><span class="pill bad" style="align-self:flex-start">No se pudo leer</span><h2>El ticket está borroso o no se distingue</h2>
    <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Ponlo sobre una superficie oscura y plana.</li><li>Busca buena luz, sin sombras ni flash directo.</li><li>Encuadra el ticket completo, del nombre de la tienda al total.</li><li>Si el ticket es térmico y está muy desgastado, regístralo a mano.</li></ul>

  const aiNote = aiAvailable() ? `<p class="small muted">Leo tus fotos con IA en línea. Si no hay internet, las leo aquí en el teléfono.</p>` : `<p class="small muted">Leo tus fotos aquí en el teléfono, sin internet.</p>`;
  return `${header("Escanear")}${err}
    ${mascotRow("feliz", say("scan_idle"), {size:"sm"})}
    <label class="drop" for="photo">${IC.camera}<h3>Toma o sube la foto del ticket</h3><p class="small muted">Claude lee cada producto, su precio y le asigna categoría. Tú solo confirmas.</p>

      <div class="row wrap"><button class="btn sm" data-act="readtext">Leer texto</button><button class="btn soft sm" data-act="example">Ticket de ejemplo</button><button class="btn soft sm" data-act="example2">Ejemplo con descuentos</button></div>`)}
    <p class="small muted">${S.keepPhotos ? "La foto se guarda solo en este dispositivo para que puedas revisarla después." : "La foto no se guarda: solo se usa para leer el ticket. Puedes activar el guardado en Configuración."}</p>`;
}
const draftSum = d => d.items.reduce((a,i)=>a+i.total,0);
const draftDiff = d => d.total == null ? 0 : d.total - draftSum(d);

    const next = $("#next");
    if (next) {
      if (ui.onb===1) next.disabled = !S.profile.name.trim();
      if (ui.onb===6) next.disabled = !(S.goal.name.trim() && S.goal.target>0);
    }
    if ($("#pctv")) $("#pctv").textContent = S.profile.savingsPct + " %";
    if ($("#plan")) $("#plan").innerHTML = planBox();
  }
  if (el.dataset.live) {
    const v = el.type==="range" ? +el.value : el.dataset.money !== undefined ? parseMoney(el.value) : el.value;
    setPath(el.dataset.live, v);
    if ($("#pctv")) $("#pctv").textContent = S.profile.savingsPct + " %";
    const box = el.closest(".fold-body, .card")?.querySelector(".sumbox"); if (box) box.innerHTML = planBox();
    save();
  }
  if (el.dataset.income) {
    const i = S.profile.incomes.find(x=>x.id===el.dataset.income);
    if (i) { i[el.dataset.k] = el.dataset.k==="amt" ? parseMoney(el.value) : el.value; const s = $("#inc-sum"); if (s) s.textContent = S.onboarded ? fmt0(monthlyIn()) + "/mes" : fmt(monthlyIn()); if (S.onboarded) save();
      if (i.src && $("#pm-" + i.src)) $("#pm-" + i.src).textContent = payMonthly(i);
      if (!S.onboarded && ui.onb === 2 && $("#next")) { const w = srcIncome("work"), b = srcIncome("beca"); $("#next").disabled = !(S.profile.student !== null && S.profile.work && (!w || w.amt > 0) && (!b || b.amt > 0)); } }
  }
  if (el.dataset.fixed) { const f = S.fixed.find(x=>x.id===el.dataset.fixed), k = el.dataset.k;
    if (f) { f[k] = el.type === "checkbox" ? el.checked : k==="amt" ? parseMoney(el.value) : k==="dueDay" ? (+el.value || null) : el.value; if (S.onboarded) save(); } }
  if (el.dataset.acc) { const a = S.accounts.find(x=>x.id===el.dataset.acc); if (a) { a[el.dataset.k] = el.dataset.k==="balance" ? parseSigned(el.value) : el.value; if ($("#cap")) $("#cap").textContent = fmt(cashBalance()); if (S.onboarded) save(); } }
  if (el.dataset.goal) { const g = S.goals.find(x=>x.id===el.dataset.goal); if (g) { g[el.dataset.k] = el.dataset.k==="target" ? parseMoney(el.value) : el.value; save(); } }
  if (el.dataset.budget) { (S.budgets ||= {})[el.dataset.budget] = parseMoney(el.value); save(); }
  if (el.dataset.item && ui.draft) {
    const it = ui.draft.items.find(x=>x.id===el.dataset.item); if (!it) return;
    if (el.dataset.k==="total") it.total = parseSigned(el.value);
    else if (el.dataset.k==="name") it.name = el.value;
  }
  if (el.id === "rv-total" && ui.draft) ui.draft.total = el.value.trim() ? parseSigned(el.value) : null;
  if (el.dataset.draft && ui.draft && el.type!=="checkbox") ui.draft[el.dataset.draft] = el.value;
  if (el.id === "chat-in") { el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight) + "px"; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "p-theme") { S.themeMode = el.value; save(); render(); toast(el.value === "auto" ? "Tema automático según la fecha" : "Vista previa: " + THEMES[el.value].name); return; }
  if (el.id === "p-fx") { S.fx = el.checked; save(); render(); return; }
  if (el.id === "p-mascot") { S.mascot = el.checked; save(); render(); return; }
  if (el.id === "p-photos") { S.keepPhotos = el.checked; save(); toast(el.checked ? "Las fotos se guardarán en este dispositivo" : "Las fotos nuevas ya no se guardarán"); return; }
  if (el.id === "photo" && el.files?.[0]) { const f = el.files[0]; el.value = ""; runScan({file:f}); return; }
  if (el.id === "rv-total" && ui.draft) { render(); return; }
  if (el.dataset.income && el.dataset.k === "freq") { const s = $("#inc-sum"); if (s) s.textContent = S.onboarded ? fmt0(monthlyIn()) + "/mes" : fmt(monthlyIn()); }
  if (el.dataset.item && el.dataset.k==="cat" && ui.draft) { const it = ui.draft.items.find(x=>x.id===el.dataset.item); if (it) { it.cat = el.value; it.review = false; } render(); }
  if (el.dataset.item && el.dataset.k==="total" && ui.draft) render();
  if (el.dataset.draft==="roundup" && ui.draft) ui.draft.roundup = el.checked;
  if (el.dataset.draft==="accountId" && ui.draft) { ui.draft.accountId = el.value; render(); }
});

// ───────────────────────── Arranque ─────────────────────────
(function boot(){
  const local = loadLocal();
  if (local && local.v === 1) S = Object.assign(freshState(), local);
  render();
})();
// Recordatorios de Merino: el teléfono los manda aunque la app esté cerrada
function remCfg(){ const r = S.reminders || {}; return { on: r.on !== false, hour: r.hour ?? 20 }; }
function reminderPayload(){
  const r = remCfg(), paid = paidFixedMap();
  return JSON.stringify({ on: !!S.onboarded && r.on, hour: r.hour, minute: 0, name: S.profile?.name || "",
    streak: S.streak?.cur || 0, streakLast: S.streak?.last || "",
    fixed: (S.fixed || []).filter(f => f.amt > 0 && f.dueDay).map(f => ({ name: f.name || "tu pago", amt: fmt0(f.amt), dueDay: f.dueDay, paid: paid[f.id] ? monthKey() : "" })) });
}
let remTimer = null;
function syncReminders(){ if (!window.AndroidBridge?.setReminders) return; clearTimeout(remTimer); remTimer = setTimeout(() => { try { AndroidBridge.setReminders(reminderPayload()); } catch {} }, 400); }
{ const baseSave = save; save = function(...a){ const out = baseSave.apply(this, a); syncReminders(); return out; }; }
syncReminders();
window.__notifPerm = ok => { if (!ok) toast("Sin permiso no puedo mandarte recordatorios. Puedes activarlo en los ajustes del teléfono."); };
document.addEventListener("change", e => { if (e.target.id === "rem-hour") { S.reminders = { ...remCfg(), hour: +e.target.value }; save(); toast(`Te aviso a las ${e.target.value}:00`); } });

// Botón "atrás" de Android: regresa de pantalla en vez de cerrar la app
window.onAndroidBack = function(){
  if (!S.onboarded) { if (ui.onb > 0) { ui.onb--; render(); return true; } return false; }
  if (ui.view === "review") { ui.draft = null; ui.view = "scan"; render(); return true; }
  if (ui.view !== "home") { ui.view = "home"; ui.selCat = null; render(); window.scrollTo(0,0); return true; }
  return false;
};
</script>
