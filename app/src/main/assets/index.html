      <radialGradient id="vHL" cx=".32" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
      ${[['hib', 'vHib', '#A8301F'], ['hibY', 'vHibY', '#B9721E']].map(([id, g, st]) => `<symbol id="v-${id}" viewBox="-17 -17 34 34">
        ${[0, 72, 144, 216, 288].map(r => `<path d="${hibPetal}" transform="rotate(${r})" fill="url(#${g})" stroke="${st}" stroke-width=".6"/><path d="M0 -2 L0 -12" transform="rotate(${r})" stroke="${st}" stroke-opacity=".35" stroke-width=".7"/>`).join('')}
        <circle r="2.6" fill="#7E1018"/><path d="M0 0 L8 -10" stroke="#F7D46A" stroke-width="1.6" stroke-linecap="round"/>${[[8, -10], [9.5, -8.5], [6.5, -11.5]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="#FFE27A"/>`).join('')}</symbol>`).join('')}
      <symbol id="v-plum" viewBox="-12 -12 24 24">${[0, 72, 144, 216, 288].map(r => `<path d="${plumPetal}" transform="rotate(${r})" fill="url(#vPlum)" stroke="#E7D3A8" stroke-width=".5"/>`).join('')}<circle r="1.6" fill="#F2B632"/></symbol>
      <symbol id="v-shell" viewBox="0 0 26 24"><path d="M13 22 L2 9 Q13 -3 24 9 Z" fill="url(#vShell)" stroke="#C9785A" stroke-width=".8" stroke-linejoin="round"/>
        ${[3.5, 6.5, 9.8, 13, 16.2, 19.5, 22.5].map(x => `<path d="M13 21 L${x} ${x < 13 ? 6.5 + (13 - x) * .35 : 6.5 + (x - 13) * .35}" stroke="#C9785A" stroke-opacity=".55" stroke-width=".8"/>`).join('')}
        <path d="M9 21 h8 l-2 2.5 h-4z" fill="#E5A17F"/><path d="M5 8 Q12 1 19 6" stroke="#fff" stroke-opacity=".6" stroke-width="1.4" fill="none"/></symbol>
      <symbol id="v-star" viewBox="-12 -12 24 24"><path d="M0 -11 C1.6 -5 2.2 -4 8.6 -3.6 C4 -.6 3.6 .6 5.4 8.8 C1 5 -1 5 -5.4 8.8 C-3.6 .6 -4 -.6 -8.6 -3.6 C-2.2 -4 -1.6 -5 0 -11Z" fill="url(#vStar)" stroke="#B5481F" stroke-width=".7"/>
        ${[[0, -6], [3.4, -2], [-3.4, -2], [2.4, 3.6], [-2.4, 3.6], [0, 0]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9" fill="#FFE2B8"/>`).join('')}</symbol>
      <symbol id="v-ball" viewBox="-12 -12 24 24"><circle r="11" fill="#fff" stroke="#9AA8B0" stroke-width=".6"/>
        ${[['#C2462A', 0], ['#F4B235', 120], ['#0E6B73', 240]].map(([c, r]) => `<path d="M0 0 L0 -11 A11 11 0 0 1 9.5 -5.5 Z" fill="${c}" transform="rotate(${r})"/>`).join('')}
        <circle r="2.4" fill="#fff" stroke="#9AA8B0" stroke-width=".5"/><circle r="11" fill="url(#vHL)"/></symbol>
      <symbol id="v-umb" viewBox="0 0 60 64"><path d="M30 14 V62" stroke="#7A5530" stroke-width="2.4"/>
        <path d="M2 30 Q30 -6 58 30 Q51 25 44.5 30 Q37 25 30 30 Q23 25 15.5 30 Q9 25 2 30Z" fill="#C2462A"/>
        <path d="M15.5 30 Q19 8 30 4 Q23 12 23 27 Q19 25 15.5 30Z M44.5 30 Q41 8 30 4 Q37 12 37 27 Q41 25 44.5 30Z" fill="#FFF6E6"/><circle cx="30" cy="4" r="2" fill="#7A5530"/></symbol>`;
  }

  const U = (id, x, y, w, h, rot = 0) => `<use href="#${id}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" transform="rotate(${rot} ${x} ${y})"/>`;
  const HB = (x, y, s, r = 0, y2) => U(y2 ? 'v-hibY' : 'v-hib', x, y, s, s, r);
  const PL = (x, y, s, r = 0) => U('v-plum', x, y, s, s, r);

  /* Hoja de palma generada: nervio central curvo + foliolos a ambos lados */
  function frond(x0, y0, len, angDeg, bend, k, grad = 'vPalm') {
    const a = angDeg * Math.PI / 180, ex = x0 + Math.cos(a) * len, ey = y0 + Math.sin(a) * len;
    const cxp = (x0 + ex) / 2 - Math.sin(a) * bend, cyp = (y0 + ey) / 2 + Math.cos(a) * bend;
    const P = t => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cxp + t * t * ex, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cyp + t * t * ey];
    const T = t => [2 * (1 - t) * (cxp - x0) + 2 * t * (ex - cxp), 2 * (1 - t) * (cyp - y0) + 2 * t * (ey - cyp)];
    let leaves = '';
    for (let t = .1; t < .97; t += .065) {
      const [px, py] = P(t), [tx, ty] = T(t), ta = Math.atan2(ty, tx);
      for (const side of [-1, 1]) {
        k++;
        const la = ta + side * (1.05 - t * .45) + (rnd(k) - .5) * .15, L = len * .42 * (1 - t * .62) * (.85 + rnd(k + 3) * .3), w = L * .16;
        const qx = px + Math.cos(la) * L, qy = py + Math.sin(la) * L, mx = (px + qx) / 2, my = (py + qy) / 2, nx = -Math.sin(la) * w, ny = Math.cos(la) * w;
        leaves += `<path d="M${px.toFixed(1)} ${py.toFixed(1)} Q${(mx + nx).toFixed(1)} ${(my + ny).toFixed(1)} ${qx.toFixed(1)} ${qy.toFixed(1)} Q${(mx - nx * .4).toFixed(1)} ${(my - ny * .4).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}Z" fill="url(#${grad})" stroke="#1F5E3A" stroke-width=".5" stroke-opacity=".6"/>`;
      }
    }
    return leaves + `<path d="M${x0} ${y0} Q${cxp.toFixed(1)} ${cyp.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#2E6A34" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }
  const sun = (x, y, r) => `<g><circle cx="${x}" cy="${y}" r="${r * 2.1}" fill="url(#vGlow)"/>
    <g class="rays" style="transform-origin:${x}px ${y}px">${Array.from({ length: 14 }, (_, i) => { const a = i * Math.PI * 2 / 14; const w = .09;
      return `<path d="M${(x + Math.cos(a - w) * r * 1.15).toFixed(1)} ${(y + Math.sin(a - w) * r * 1.15).toFixed(1)} L${(x + Math.cos(a) * r * (i % 2 ? 1.5 : 1.7)).toFixed(1)} ${(y + Math.sin(a) * r * (i % 2 ? 1.5 : 1.7)).toFixed(1)} L${(x + Math.cos(a + w) * r * 1.15).toFixed(1)} ${(y + Math.sin(a + w) * r * 1.15).toFixed(1)}Z" fill="#F7BF3A"/>`; }).join('')}</g>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#vSun)"/><ellipse cx="${x - r * .35}" cy="${y - r * .38}" rx="${r * .35}" ry="${r * .2}" fill="#fff" opacity=".45" transform="rotate(-30 ${x - r * .35} ${y - r * .38})"/></g>`;
  const cloud = (x, y, s, cls = 'cloud') => `<g class="${cls}"><path transform="translate(${x} ${y}) scale(${s})" d="M-30 8 Q-32 -6 -18 -6 Q-14 -20 0 -16 Q8 -26 20 -16 Q34 -16 32 -2 Q40 2 34 10 Z" fill="url(#vCloud)" stroke="#D3E6EC" stroke-width="1"/>
    <path transform="translate(${x} ${y}) scale(${s})" d="M-24 8 Q-4 13 28 8" stroke="#C9DEE5" stroke-width="2" fill="none" opacity=".7"/></g>`;
  const gull = `<svg viewBox="-14 -8 28 16"><g class="bw"><path d="M0 2 Q-6 -6 -13 -1" stroke="#36556A" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M0 2 Q6 -6 13 -1" stroke="#36556A" stroke-width="2.2" fill="none" stroke-linecap="round"/></g></svg>`;

  function lei() {
    const cx = 85, cy = 85, r = 77; let s = '';
    for (let a = 0; a < 360; a += 15) {
      const rad = a * Math.PI / 180, x = cx + r * Math.cos(rad), y = cy + r * Math.sin(rad), i = a / 15;
      s += i % 3 === 0 ? HB(x, y, 20, a, i % 2) : i % 3 === 1 ? PL(x, y, 15, a) : `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(Math.cos(rad + 1.6) * 9).toFixed(1)} ${(Math.sin(rad + 1.6) * 9).toFixed(1)}" stroke="#3E8A4E" stroke-width="4" stroke-linecap="round"/>`;
    }
    return `<svg class="art-wreath" viewBox="0 0 170 170" aria-hidden="true">${s}</svg>`;
  }

  function sparkles(n) {
    let s = Array.from({ length: n }, (_, i) => {
      const star = i % 3 === 0, size = star ? 10 + (i % 3) * 3 : 5 + (i * 7) % 6;
      const inner = star ? `<svg viewBox="-6 -6 12 12"><path d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6Z" fill="#FFD866"/></svg>` : '<span class="bokeh"></span>';
      return `<span class="rise" style="left:${(i * 37) % 94 + 2}%;width:${size}px;height:${size}px;animation-duration:${10 + (i % 5) * 2.4}s;animation-delay:-${(i * 1.7).toFixed(1)}s">${inner}</span>`;
    }).join('');
    s += [[120, 20, 0], [210, 26, -11]].map(([top, dur, del]) => `<span class="fly gull" style="top:${top}px;animation-duration:${dur}s;animation-delay:${del}s">${gull}</span>`).join('');
    return s;
  }

  ARTE.registrar('verano', {
    defs: defs(),
    escena: () => ({
      back: `<svg class="art-back" viewBox="0 0 370 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g filter="url(#vBlur)" opacity=".5">${frond(380, 470, 140, 200, -30, 50, 'vPalm2')}${HB(10, 300, 100, 20)}${PL(350, 200, 70, 10)}${HB(20, 660, 90, 0, 1)}</g>
        <defs><filter id="vBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs></svg>`,
      top: `<svg class="art-top" viewBox="0 0 340 230" aria-hidden="true">
        ${cloud(150, 62, .9)}${sun(246, 78, 30)}${cloud(214, 120, .62, 'cloud c2')}${cloud(64, 84, .5, 'cloud c3')}</svg>`,
      left: `<svg class="art-left" viewBox="0 0 190 230" aria-hidden="true">
        <path d="M-6 230 Q10 170 24 130" stroke="url(#vTrunk)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M-2 220 l8 -4 M2 200 l9 -3 M7 180 l9 -2 M12 160 l9 -2 M17 142 l8 -1" stroke="#6B4A28" stroke-width="1.6" stroke-linecap="round"/>
        ${frond(24, 130, 130, -60, -26, 100)}${frond(24, 130, 140, -18, -30, 200, 'vPalm2')}${frond(24, 130, 120, 22, -26, 300)}${frond(24, 130, 100, -100, 20, 400, 'vPalm2')}
        <circle cx="20" cy="136" r="7" fill="#7A5530"/><circle cx="31" cy="138" r="6.5" fill="#8A6038"/><circle cx="25" cy="145" r="6" fill="#6B4A28"/>
        ${HB(96, 92, 26, 15)}${PL(112, 106, 16, 30)}</svg>`,
      ground: `<svg class="art-ground" viewBox="0 0 370 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 30 Q46 20 92 30 T184 30 T276 30 T370 28 V90 H0Z" fill="url(#vSea)" opacity=".9"/>
        <path class="wave" d="M-40 34 q23 -10 46 0 t46 0 t46 0 t46 0 t46 0 t46 0 t46 0 t46 0 t46 0 t46 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".85" stroke-linecap="round"/>
        <path d="M0 58 Q90 46 190 56 T370 52 V90 H0Z" fill="url(#vSand)"/>
        <path d="M0 58 Q90 46 190 56 T370 52" stroke="#FFFFFF" stroke-width="2.4" fill="none" opacity=".7"/>
        ${U('v-umb', 30, 34, 44, 46)}${U('v-shell', 88, 66, 14, 13, -10)}${U('v-star', 300, 66, 16, 16, 20)}${U('v-ball', 340, 60, 18, 18)}${U('v-shell', 250, 70, 11, 10, 15)}</svg>`,
      falls: sparkles(16),
      hero: `<svg viewBox="0 0 150 150" aria-hidden="true">${frond(160, 10, 110, 150, 22, 600)}${frond(160, 10, 90, 118, -16, 700, 'vPalm2')}
        ${HB(108, 66, 34, 10)}${PL(130, 84, 22, 20)}${HB(84, 40, 22, -20, 1)}${U('v-shell', 128, 116, 22, 20, -12)}</svg>`,
      wreath: lei(),
      stick: {
        tr: () => `<svg class="art-stick tr" viewBox="0 0 80 70" aria-hidden="true">${frond(70, 10, 46, 150, 10, 800)}${HB(40, 34, 30, 10)}${PL(58, 44, 18, 20)}</svg>`,
        tl: () => `<svg class="art-stick tl" viewBox="0 0 80 70" aria-hidden="true">${U('v-star', 36, 36, 34, 34, -15)}</svg>`,
        br: () => `<svg class="art-stick br" viewBox="0 0 80 70" aria-hidden="true">${U('v-ball', 42, 38, 30, 30, 20)}</svg>`,
        bl: () => `<svg class="art-stick bl" viewBox="0 0 80 70" aria-hidden="true">${U('v-shell', 32, 40, 34, 31, -12)}${PL(56, 30, 18)}</svg>`
      },
      page: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g filter="url(#vPageBlur)" opacity=".75">
        <circle cx="1080" cy="120" r="150" fill="url(#vGlow)"/>${frond(-20, 760, 340, -50, -60, 900)}${HB(1100, 640, 220, 10)}${PL(140, 160, 160, 0)}${frond(1240, 360, 280, 200, 40, 1000, 'vPalm2')}</g>
        <defs><filter id="vPageBlur"><feGaussianBlur stdDeviation="8"/></filter></defs></svg>`
    })
  });
})();

</script>
<script>/* fiestas-arte.js */
/* Tu Lana · Arte de las fechas festivas (misma API que <temporada>-arte.js: ARTE.registrar).
   Cada fiesta trae su escena pintada (guirnalda arriba, rama a la izquierda, fondo desenfocado,
   lo que cae, arte del aviso, corona de la dona, adornos de tarjeta), el adorno del cochinito
   y sus colores de interfaz (vars). Solo decoración: todo va con aria-hidden.
   Lote 1: Temporada de aguinaldo, Posadas y Navidad, Año Nuevo y Día de Reyes. */
(function () {
  const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const U = (id, x, y, w, h, rot = 0) => `<use href="#${id}" x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w}" height="${h}" transform="rotate(${rot} ${x} ${y})"/>`;
  const svg = (cls, vb, inner) => `<svg class="${cls}" viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
  const blur = (id, inner, sd = 5) => `<svg class="art-back" viewBox="0 0 370 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g filter="url(#${id})" opacity=".5">${inner}</g><defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${sd}"/></filter></defs></svg>`;
  const string = (x1, y1, x2, y2, c = '#8A6A3A') => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${c}" stroke-width="1.1" opacity=".8"/>`;
  // Cae: cada pieza es un <svg> pequeño que revolotea al caer
  const fall = (i, inner, vb, size, opts = {}) => {
    const near = opts.near ?? i % 7 === 5;
    return `<span class="fall2${opts.cls ? ' ' + opts.cls : ''}${near ? ' near' : ''}" style="left:${(i * 31 + (opts.off || 0)) % 94 + 2}%;width:${near ? size * 1.7 : size}px;animation-duration:${(opts.dur || 12) + (i % 5) * 2.2}s;animation-delay:-${(i * 2.3).toFixed(1)}s">
      <span class="flut" style="animation-duration:${1.8 + (i % 4) * .6}s"><svg viewBox="${vb}">${inner}</svg></span></span>`;
  };
  const confetti = (i, cols) => {
    const c = cols[i % cols.length], k = i % 3;
    return k === 0 ? `<rect x="0" y="2" width="12" height="6" rx="1.5" fill="${c}"/>` : k === 1 ? `<circle cx="6" cy="5" r="4" fill="${c}"/>`
      : `<path d="M1 7 Q4 1 6 5 T11 3" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  };
  const sparkle = (x, y, s, c = '#F5C542') => `<path d="M${x} ${y - s} Q${x + s * .18} ${y - s * .18} ${x + s} ${y} Q${x + s * .18} ${y + s * .18} ${x} ${y + s} Q${x - s * .18} ${y + s * .18} ${x - s} ${y} Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${c}"/>`;
  const star = (x, y, s, rot = 0) => U('f-star', x, y, s, s, rot);
  const coin = (x, y, s, rot = 0) => U('f-coin', x, y, s, s, rot);

  /* ---------- Símbolos compartidos ---------- */
  const starPath = (r1, r2, n = 5) => 'M' + Array.from({ length: n * 2 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; return `${(r * Math.cos(a)).toFixed(2)} ${(r * Math.sin(a)).toFixed(2)}`; }).join(' L') + 'Z';
  const defs = () => `
    <radialGradient id="fHL" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset=".5" stop-color="#F2BE2E"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <radialGradient id="fCoin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF0B0"/><stop offset=".5" stop-color="#F2C230"/><stop offset="1" stop-color="#A87A0C"/></radialGradient>
    <linearGradient id="fRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EF5A4E"/><stop offset="1" stop-color="#A51E22"/></linearGradient>
    <linearGradient id="fGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FAE7A"/><stop offset="1" stop-color="#1A6B42"/></linearGradient>
    <linearGradient id="fPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B7BF0"/><stop offset="1" stop-color="#4B2EA8"/></linearGradient>
    <linearGradient id="fBread" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8A65A"/><stop offset="1" stop-color="#A9601F"/></linearGradient>
    <symbol id="f-star" viewBox="-12 -12 24 24"><path d="${starPath(11, 4.8)}" fill="url(#fGold)" stroke="#A87A0C" stroke-width=".9" stroke-linejoin="round"/><path d="${starPath(11, 4.8)}" fill="url(#fHL)"/></symbol>
    <symbol id="f-coin" viewBox="-12 -12 24 24"><circle r="11" fill="url(#fCoin)" stroke="#9A6E0A" stroke-width="1"/><circle r="7.6" fill="none" stroke="#C99A1C" stroke-width="1.1"/>
      <path d="M2.6 -3.2 Q0 -5 -2.2 -3.4 Q-3.6 -1.2 0 0 Q3.6 1.2 2.2 3.4 Q0 5 -2.6 3.2 M0 -6.2 V6.2" stroke="#8A5E08" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-4.5" cy="-5" rx="3" ry="1.8" fill="#fff" opacity=".55" transform="rotate(-35 -4.5 -5)"/></symbol>
    ${[['R', 'url(#fRed)', '#F5C542', '#7E1418'], ['G', 'url(#fGreen)', '#E0464C', '#124A2E'], ['O', 'url(#fGold)', '#1E7F5C', '#8A640A']].map(([k, box, rib, dk]) => `
    <symbol id="f-gift${k}" viewBox="0 0 32 34">
      <rect x="3" y="13" width="26" height="19" rx="2" fill="${box}" stroke="${dk}" stroke-width=".9"/>
      <rect x="1.5" y="9" width="29" height="6.5" rx="1.6" fill="${box}" stroke="${dk}" stroke-width=".9"/>
      <rect x="13.5" y="9" width="5" height="23" fill="${rib}"/><rect x="3" y="15.5" width="26" height="2.4" fill="#000" opacity=".12"/>
      <path d="M16 9 C10 1 3 4 7 8 C9 10 13 9.5 16 9Z M16 9 C22 1 29 4 25 8 C23 10 19 9.5 16 9Z" fill="${rib}" stroke="${dk}" stroke-width=".7"/>
      <rect x="3" y="13" width="26" height="19" rx="2" fill="url(#fHL)"/></symbol>`).join('')}
    <symbol id="f-poin" viewBox="-22 -22 44 44">
      ${[0, 72, 144, 216, 288].map(a => `<path transform="rotate(${a + 36})" d="M0 -3 C5 -9 4 -17 0 -21 C-4 -17 -5 -9 0 -3Z" fill="#1E7A46" stroke="#11502C" stroke-width=".6"/>`).join('')}
      ${[0, 60, 120, 180, 240, 300].map(a => `<path transform="rotate(${a})" d="M0 -2 C6 -8 5 -16 0 -20 C-5 -16 -6 -8 0 -2Z" fill="url(#fRed)" stroke="#7E1418" stroke-width=".7"/><path transform="rotate(${a})" d="M0 -4 V-17" stroke="#FFB0A8" stroke-width=".8" opacity=".6"/>`).join('')}
      ${[0, 72, 144, 216, 288].map(a => `<circle cx="${(3 * Math.cos(a * Math.PI / 180)).toFixed(1)}" cy="${(3 * Math.sin(a * Math.PI / 180)).toFixed(1)}" r="1.8" fill="#F5C542" stroke="#9A7A10" stroke-width=".5"/>`).join('')}
      <circle r="1.6" fill="#5E9A2E"/></symbol>
    ${[['r', '#F0484E'], ['g', '#F5C542'], ['v', '#34B06A'], ['b', '#3D8CE0']].map(([k, c]) => `
    <symbol id="f-bulb${k}" viewBox="0 0 14 22"><rect x="4" y="0" width="6" height="5" rx="1" fill="#6E6A5E"/>
      <path d="M7 4 C13 7 13 15 7 21 C1 15 1 7 7 4Z" fill="${c}"/><ellipse cx="5" cy="10" rx="1.6" ry="3" fill="#fff" opacity=".6"/></symbol>`).join('')}
    <symbol id="f-pinata" viewBox="-44 -44 88 88">
      ${['#E2445C', '#F5C542', '#2F9EE0', '#2BB673', '#F28C14', '#B455D6', '#FF6FA0'].map((c, i) => { const a = i * 360 / 7; return `<g transform="rotate(${a})"><path d="M-7 -14 L0 -40 L7 -14Z" fill="${c}" stroke="#00000022" stroke-width=".8"/><path d="M0 -40 l-3 -4 M0 -40 l0 -5 M0 -40 l3 -4" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/></g>`; }).join('')}
      <circle r="16" fill="url(#fGold)" stroke="#A87A0C" stroke-width="1"/><path d="M-14 -5 Q0 -12 14 -5 M-15 3 Q0 -4 15 3 M-13 10 Q0 4 13 10" stroke="#E2445C" stroke-width="2.2" fill="none"/>

  // Rosca de Reyes como anillo (corona de la dona y arte del aviso)
  function rosca(cx, cy, rx, ry, w, seed = 0) {
    let s = `<ellipse cx="${cx}" cy="${cy + w * .25}" rx="${rx}" ry="${ry}" fill="none" stroke="#7A3E12" stroke-opacity=".35" stroke-width="${w}"/>`
      + `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="url(#fBread)" stroke-width="${w}"/>`
      + `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#F4C27E" stroke-width="${w * .3}" stroke-opacity=".5" transform="translate(0 -${w * .2})"/>`;
    const n = 14;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + seed, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a), rot = a * 180 / Math.PI + 90;
      if (i % 2 === 0) s += `<rect x="${(x - w * .42).toFixed(1)}" y="${(y - w * .16).toFixed(1)}" width="${(w * .84).toFixed(1)}" height="${(w * .32).toFixed(1)}" rx="${(w * .16).toFixed(1)}" fill="#FFF4E0" stroke="#E6D2B0" stroke-width=".6" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      else s += `<rect x="${(x - w * .3).toFixed(1)}" y="${(y - w * .12).toFixed(1)}" width="${(w * .6).toFixed(1)}" height="${(w * .24).toFixed(1)}" rx="1.5" fill="${['#C62839', '#2F9E6E', '#F2A31B'][i % 3]}" transform="rotate(${(rot + 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
    return s;
  }

    vars: { ink: '#45172A', muted: '#7A5462', sec: '#8E1F4A', surface: '#FFFCFD', exp: '#B02A40', inc: '#2E7A5E', good: '#2E7A5E', mint: '#2E7A5E', 'mint-soft': '#DDEFE5',
      light1: 'rgba(255,238,242,.95)', light2: 'rgba(214,51,108,.14)', 'warn-s': '#FCE3E8', bub: '#EECAD5', 'hero-a': '#FFF9FA', 'hero-b': '#FBE4EA', 'hero-t': '#45172A', 'hero-c': '#B0284F', 'seg-bg': '#F7E4EA', imp: '#6B3A8C' },
    pig: `<g transform="translate(214 50)">${heart('r', 0, 0, 22, 14)}${heart('p', -14, 8, 13, -18)}</g>`,

        ${sparkle(240, 40, 6, '#F7A6C4')}${sparkle(150, 110, 5, '#FFD447')}${sparkle(90, 50, 5, '#F7A6C4')}`),

        bl: () => svg('art-stick bl', '0 0 80 70', `${U('f-kite', 34, 32, 30, 38, -12)}`)

  /* ═════════ Día de las Madres: rosas, ramo y listón ═════════ */
  const rose = (k, x, y, s, r = 0) => U('f-rose' + k, x, y, s, s, r);
  const bloom = (x, y, s) => P(5, i => { const a = deg(i * 72); return `<circle cx="${(x + s * Math.cos(a)).toFixed(1)}" cy="${(y + s * Math.sin(a)).toFixed(1)}" r="${s * .7}" fill="#fff"/>`; }) + `<circle cx="${x}" cy="${y}" r="${s * .5}" fill="#FFE08A"/>`;
  const bouquet = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">

    ${bloom(-6, -38, 2.4)}${bloom(26, -30, 2)}${bloom(-30, -24, 2)}
    <path d="M-20 -2 L0 38 L20 -2Z" fill="#D9B07A" stroke="#A9804A" stroke-width="1"/><path d="M-20 -2 L-4 30 M20 -2 L4 30" stroke="#C49A62" stroke-width="1"/>

<script>/* fiestas3-arte.js */
/* Tu Lana · Arte de las fechas festivas, lote 3 (usa window.FKIT de fiestas-arte.js).
   Día del Estudiante, Día del Padre, Regreso a clases, Fiestas Patrias, Día de Muertos y El Buen Fin.
   Solo decoración: todo va con aria-hidden. */
(function () {
  if (!window.FKIT) return;
  const { rnd, U, svg, blur, string, fall, confetti, sparkle, star, coin, bow } = window.FKIT;
  const P = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');
  const deg = a => a * Math.PI / 180;
  const ring = (n, f, r = 77, a0 = 0) => P(n, i => { const a = deg(a0 + i * 360 / n); return f(85 + r * Math.cos(a), 85 + r * Math.sin(a), a0 + i * 360 / n, i); });
  const petals = (cx, cy, c, r, n, d) => P(n, i => { const a = deg(i * 360 / n - 90); return `<circle cx="${(cx + d * Math.cos(a)).toFixed(1)}" cy="${(cy + d * Math.sin(a)).toFixed(1)}" r="${r}" fill="${c}"/>`; });
  const q = (x1, y1, cx, cy, x2, y2) => t => [(1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2, (1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t * t * y2];
  // Cuelga n piezas a lo largo de un cordel curvo; f(x, y, rot, i) dibuja cada una
  const hang = (x1, y1, cx, cy, x2, y2, n, f, c = '#7A6A5A') => {
    const p = q(x1, y1, cx, cy, x2, y2);
    return `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" stroke="${c}" stroke-width="1.2" fill="none"/>` + P(n, i => {
      const t = (i + .5) / n, [x, y] = p(t), [xa, ya] = p(t - .01), [xb, yb] = p(t + .01);
      return f(x, y, Math.atan2(yb - ya, xb - xa) * 180 / Math.PI, i);
    });
  };

  // Papel picado: banderitas de papel con borde en zigzag y figura recortada
  function picado(w, h, c, motif) {
    let d = `M${-w / 2} 0 H${w / 2} V${h - 3}`;
    for (let k = 6; k >= 0; k--) d += ` L${(-w / 2 + w * k / 6).toFixed(1)} ${k % 2 ? h : h - 4}`;
    const cut = 'fill="#fff" fill-opacity=".62"';
    const cx = 0, cy = h * .46, s = w / 26;
    const m = motif === 'calavera'
      ? `<path d="M${cx - 6 * s} ${cy + 1 * s} a${6 * s} ${6 * s} 0 1 1 ${12 * s} 0 v${3 * s} h${-2 * s} v${2 * s} h${-8 * s} v${-2 * s} h${-2 * s}Z" ${cut}/><circle cx="${cx - 2.4 * s}" cy="${cy}" r="${1.7 * s}" fill="${c}"/><circle cx="${cx + 2.4 * s}" cy="${cy}" r="${1.7 * s}" fill="${c}"/>`
      : motif === 'rombo' ? `<path d="M${cx} ${cy - 7 * s} L${cx + 6 * s} ${cy} L${cx} ${cy + 7 * s} L${cx - 6 * s} ${cy}Z" ${cut}/><path d="M${cx} ${cy - 3 * s} L${cx + 2.6 * s} ${cy} L${cx} ${cy + 3 * s} L${cx - 2.6 * s} ${cy}Z" fill="${c}"/>`
      : motif === 'estrella' ? `<path d="M${cx} ${cy - 7 * s} L${cx + 2 * s} ${cy - 2 * s} L${cx + 7 * s} ${cy - 2 * s} L${cx + 3 * s} ${cy + 1.5 * s} L${cx + 4.5 * s} ${cy + 6.5 * s} L${cx} ${cy + 3.5 * s} L${cx - 4.5 * s} ${cy + 6.5 * s} L${cx - 3 * s} ${cy + 1.5 * s} L${cx - 7 * s} ${cy - 2 * s} L${cx - 2 * s} ${cy - 2 * s}Z" ${cut}/>`
      : `${petals(cx, cy, '#fff', 2.4 * s, 6, 4 * s).replace(/fill="#fff"/g, cut)}<circle cx="${cx}" cy="${cy}" r="${1.8 * s}" ${cut}/>`;
    const dots = P(5, k => `<circle cx="${(-w / 2 + w * (k + .5) / 5).toFixed(1)}" cy="${(h * .12).toFixed(1)}" r="${(.9 * s).toFixed(1)}" ${cut}/>`) + P(4, k => `<path d="M${(-w / 2 + w * (k + .7) / 4.6).toFixed(1)} ${(h * .82).toFixed(1)} l${1.6 * s} ${-1.6 * s} l${1.6 * s} ${1.6 * s}" stroke="#fff" stroke-opacity=".6" stroke-width="${.9 * s}" fill="none"/>`);
    return `<path d="${d}Z" fill="${c}"/>${m}${dots}<path d="${d}Z" fill="#000" opacity=".06" transform="translate(${w * .25} 0) scale(.5 1)"/>`;
  }
  const picadoRow = (x1, y1, cx, cy, x2, y2, n, cols, w, h, motifs) => hang(x1, y1, cx, cy, x2, y2, n, (x, y, r, i) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(r * .6).toFixed(1)})">${picado(w, h, cols[i % cols.length], motifs[i % motifs.length])}</g>`, '#5A4A3A');

  const defs = `
    <linearGradient id="fNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3C6FA6"/><stop offset="1" stop-color="#173B60"/></linearGradient>
    <symbol id="f-cap" viewBox="-24 -14 48 36"><path d="M-11 4 Q-11 14 0 14 Q11 14 11 4 V0 H-11Z" fill="#1E2A44"/><path d="M0 -12 L22 -2 L0 8 L-22 -2Z" fill="#26324F" stroke="#141C30" stroke-width="1" stroke-linejoin="round"/>
      <path d="M0 -9 L15 -2" stroke="#fff" stroke-width="1.2" opacity=".25"/><path d="M0 -2 L16 2 L17 12" stroke="#F5C542" stroke-width="1.6" fill="none"/><path d="M15 11 H19 L18.5 19 H15.5Z" fill="#F5C542"/><circle cy="-2" r="1.8" fill="#F5C542"/></symbol>

const DAY = 864e5;
function retoProgress(r, startIso){
  const start = new Date(startIso).getTime(), now = Date.now();
  if (r.kind === "nocat") {
    const broke = S.receipts.some(x => new Date(x.at).getTime() >= start && x.items.some(i => r.cats.includes(i.cat) && i.total > 0));
    const d = Math.min(r.days, Math.floor((now - start) / DAY));
    return { cur:d, goal:r.days, label:`${d} de ${r.days} días`, failed:broke, done:!broke && d >= r.days };
  }
  if (r.kind === "save") {
    const end = new Date(start); end.setMonth(end.getMonth() + 1, 1); end.setHours(0,0,0,0);
    const s = S.contributions.filter(c => c.amt > 0 && new Date(c.at).getTime() >= start && new Date(c.at) < end).reduce((a, c) => a + c.amt, 0);
    return { cur:Math.min(s, r.amt), goal:r.amt, label:`${fmt0(s)} de ${fmt0(r.amt)}`, failed: now >= end.getTime() && s < r.amt, done: s >= r.amt };
  }
  if (r.kind === "streak") {
    const days = new Set(S.receipts.filter(x => new Date(x.at).getTime() >= start - DAY).map(x => dayKey(x.at)));
    let n = 0; const d = new Date(); if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
    while (days.has(dayKey(d)) && d.getTime() >= start - DAY) { n++; d.setDate(d.getDate() - 1); }
    return { cur:Math.min(n, r.days), goal:r.days, label:`${Math.min(n, r.days)} de ${r.days} días`, failed:false, done:n >= r.days };
  }
  const n = S.contributions.filter(c => c.reason === "antojo_evitado" && new Date(c.at).getTime() >= start).length;
  return { cur:Math.min(n, r.n), goal:r.n, label:`${Math.min(n, r.n)} de ${r.n}`, failed:false, done:n >= r.n };
}
function checkRetos(){

  for (const [id, a] of Object.entries(st.active)) {

    const p = retoProgress(r, a.start);

    } else if (p.failed && !a.failed) { a.failed = true; changed = true; }

}

// ───────────────────────── Resumen semanal ─────────────────────────
function weekStats(offsetWeeks = 0){
  const start = periodStart("week"); start.setDate(start.getDate() - 7 * offsetWeeks);
  const end = new Date(start); end.setDate(end.getDate() + 7);
  const by = {}; let total = 0, n = 0;
  for (const r of S.receipts) { const t = new Date(r.at); if (t < start || t >= end || r.source === "fijo") continue; n++;
    for (const i of r.items) { by[i.cat] = (by[i.cat] || 0) + i.total; total += i.total; } }
  const saved = S.contributions.filter(c => { const t = new Date(c.at); return c.amt > 0 && t >= start && t < end; }).reduce((a, c) => a + c.amt, 0);
  const top = Object.entries(by).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])[0];
  const imp = Object.entries(by).filter(([c]) => CATS[c]?.imp).reduce((a, [, v]) => a + Math.max(0, v), 0);
  return { start, total, n, saved, top, impPct: total > 0 ? Math.round(imp / total * 100) : 0, key: dayKey(start) };
}
function weeklyText(w){
  if (!w.n && !w.saved) return "Esta semana no registraste gastos. ¿Se te pasó escanear algún ticket?";
  return `Gastaste ${fmt0(w.total)}${w.top ? `; lo que más fue ${CATS[w.top[0]]?.n.toLowerCase() || "otros"} (${fmt0(w.top[1])})` : ""}.${w.saved ? ` Apartaste ${fmt0(w.saved)} en tu cochinito.` : ""}`;
}
function weeklyCard(){
  const dow = new Date().getDay(); if (dow !== 0 && dow !== 1) return "";
  const w = weekStats(dow === 1 ? 1 : 0); if (S.weeklySeen === w.key) return "";
  const prev = weekStats(dow === 1 ? 2 : 1), diff = w.total - prev.total;
  const cmp = prev.total > 0 && w.total > 0 ? (diff <= 0 ? `<span class="pill good">${fmt0(-diff)} menos que la semana anterior</span>` : `<span class="pill imp">${fmt0(diff)} más que la semana anterior</span>`) : "";
  return `<div class="card weekly"><div class="row between"><h3>${dow === 1 ? "Tu semana pasada" : "Tu semana"}</h3><button class="x" data-act="weeklyseen" data-k="${w.key}" aria-label="Cerrar resumen">×</button></div>
    ${mascotRow(diff <= 0 ? "celebra" : "piensa", weeklyText(w), { size:"sm" })}
    <div class="row wrap" style="gap:8px">${cmp}${w.impPct ? `<span class="pill">Impulsivo ${w.impPct} %</span>` : ""}</div></div>`;
}

function wrapLines(ctx, text, maxW){
  const words = String(text).split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

  const ov = document.createElement("div"); ov.className = "cel-ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", c.title);

async function checkUpdate(){

  if (Date.now() - last < 3600e3 && !ui.forceUpd) return;
  try {
    const r = await fetch(UPDATE_URL + "?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) return;
    const v = await r.json(); try { localStorage.setItem("tulana-upd-check", String(Date.now())); localStorage.setItem("tulana-upd", JSON.stringify(v)); } catch {}
    if (+v.code > +AndroidBridge.appVersionCode()) { ui.update = v; render(); askUpdate(v); }
  } catch {}
}
function askUpdate(v){
  if (ui.updAsked || document.querySelector(".upd-dlg")) return;
  let later = ""; try { later = localStorage.getItem("tulana-upd-later") || ""; } catch {}
  const [lc, lt] = later.split(":"); if (+lc === +v.code && Date.now() - (+lt || 0) < 864e5) return;

    <div class="row" style="gap:10px;justify-content:flex-end"><button class="btn ghost" data-upd="later">${tr("Después")}</button><a class="btn accent" href="${APK_URL}" data-upd="now">${tr("Actualizar ahora")}</a></div></div>`;
  const close = () => d.remove();

async function aiVoice(text){

async function productPhoto(file){
  if (!aiAvailable() || navigator.onLine === false) { toast("Para reconocer productos necesito internet. Mientras, regístralo a mano."); ACT.manual(); return; }
  const preview = URL.createObjectURL(file);
  ui.view = "scan"; ui.scan = { status:"reading", preview, error:null }; render();
  try {
    ui.ctl = new AbortController();
    const img = await blobToBase64(await imageToBlob(file));
    const r = aiItemsFrom(await callClaude(MODEL_FAST, productPrompt(), img, ui.ctl.signal));
    if (!r.items.length) { ui.scan = { status:"unreadable", preview }; return render(); }
    const sinPrecio = r.items.filter(i => !i.total).length;
    const notes = [LANG === "en" ? `I recognized ${r.items.length} product(s).${sinPrecio ? " Type the price where it's missing." : ""}` : `Reconocí ${r.items.length === 1 ? "1 producto" : r.items.length + " productos"}.${sinPrecio ? " Escribe el precio donde falte." : ""}`];

    if (S.keepPhotos) { try { ui.draft.photo = await imageToBlob(file, 1280); } catch {} }
    ui.scan = null; ui.view = "review"; render();
    const f = ui.draft.items.find(i => !i.total); if (f) $(`#it-p-${f.id}`)?.focus();
  } catch (e) {
    if (e?.code === "cancelled") { ui.scan = null; return render(); }

  }
}

// ---------- Calendario ----------
const D = (y, m, d) => new Date(y, m - 1, d);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
function nthWeekday(y, m, wd, n){ const first = D(y, m, 1); return D(y, m, 1 + ((wd - first.getDay() + 7) % 7) + (n - 1) * 7); }
function easterSunday(y){ // algoritmo gregoriano anónimo
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return D(y, month, day);
}
function holidayRanges(y){
  const pascua = easterSunday(y);
  const diaPadre = nthWeekday(y, 6, 0, 3);      // tercer domingo de junio
  const revolucion = nthWeekday(y, 11, 1, 3);   // tercer lunes de noviembre (El Buen Fin termina ese día, aprox.)
  return [
    ["anio_nuevo", D(y - 1, 12, 31), D(y, 1, 2)],
    ["reyes", D(y, 1, 3), D(y, 1, 6)],
    ["cuesta", D(y, 1, 7), D(y, 1, 31)],
    ["amor", D(y, 2, 7), D(y, 2, 14)],
    ["semana_santa", addDays(pascua, -7), pascua],
    ["nino", D(y, 4, 28), D(y, 4, 30)],
    ["madres", D(y, 5, 6), D(y, 5, 10)],
    ["estudiante", D(y, 5, 20), D(y, 5, 23)],
    ["padre", addDays(diaPadre, -4), diaPadre],
    ["regreso", D(y, 8, 10), D(y, 8, 31)],
    ["patrio", D(y, 9, 1), D(y, 9, 16)],
    ["muertos", D(y, 10, 25), D(y, 11, 2)],
    ["buen_fin", addDays(revolucion, -4), revolucion],
    ["aguinaldo", D(y, 12, 1), D(y, 12, 15)],
    ["navidad", D(y, 12, 16), D(y, 12, 30)],
  ].map(([id, from, to]) => ({ id, from, to }));
}
function liveHoliday(date = new Date()){
  const d = midnight(date), y = d.getFullYear();

  return null;
}
function seasonOf(date = new Date()){

}
function seasonRange(id, ref){
  const y = ref.getFullYear();
  const mk = yy => ({ primavera:[D(yy,3,20), D(yy,6,20)], verano:[D(yy,6,21), D(yy,9,21)], otono:[D(yy,9,22), D(yy,12,20)], invierno:[D(yy,12,21), D(yy+1,3,19)] })[id];
  for (const yy of [y - 1, y, y + 1]) { const [from, to] = mk(yy); if (ref >= from && ref <= to) return { id, from, to }; }
  for (const yy of [y, y + 1]) { const [from, to] = mk(yy); if (from > ref) return { id, from, to }; }
  return null;
}
function themeRange(id, ref = new Date()){
  ref = midnight(ref);
  if (THEMES[id].kind !== "fiesta") return seasonRange(id, ref);
  const y = ref.getFullYear(); let next = null;
  for (const yy of [y, y + 1, y + 2]) for (const r of holidayRanges(yy)) {
    if (r.id !== id) continue;
    if (ref >= r.from && ref <= r.to) return r;
    if (r.from > ref && (!next || r.from < next.from)) next = r;
  }
  return next;
}
function rangeLabel(r){

  return a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MESES[b.getMonth()]}`
    : `${a.getDate()} ${MESES[a.getMonth()]} – ${b.getDate()} ${MESES[b.getMonth()]}`;
}
function upcomingHolidays(n = 4, ref = new Date()){
  ref = midnight(ref); const y = ref.getFullYear();
  return [...holidayRanges(y), ...holidayRanges(y + 1)].filter(r => r.from > ref).sort((a, b) => a.from - b.from).slice(0, n);

function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a === "dark" || a === "light") return a === "dark";
  try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch { return false; }

const THEME_VARS = ["--bg","--sunk","--line","--accent","--accent-ink","--liquid","--liquid-2","--glass","--glass-edge"];
let appliedTheme = "", lastBar = "";
function applyTheme(){
  const t = themeNow();
  if (appliedTheme !== t.id) {
    appliedTheme = t.id;
    const block = vals => THEME_VARS.map((n, i) => `${n}:${vals[i]}`).join(";");
    const el = document.getElementById("season-style");
    if (el) el.textContent = `:root{${block(t.pal[0])}}`
      + `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${block(t.pal[1])}}}`
      + `:root[data-theme="dark"]{${block(t.pal[1])}}`;
    document.documentElement.setAttribute("data-season", t.id);
  }
  if (window.ARTE_APP) ARTE_APP.pintar(ART_ID());   // arte pintado de la fiesta o de la estación
  const dark = isDark(), bg = t.pal[dark ? 1 : 0][0];
  if (lastBar !== bg + dark) {
    lastBar = bg + dark;
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute("content", bg);
    try { window.AndroidBridge?.setBarColor(bg, dark); } catch {}
  }
  startFx(t);
}

const FX = { cv:null, ctx:null, parts:[], raf:0, key:"", type:"", colors:[], last:0, w:0, h:0 };
function startFx(t){
  // Con el arte pintado activo, lo que cae (hojas, nieve, pétalos, brillos) lo dibuja arte-app.js
  if (window.ARTE_APP?.tiene(ART_ID())) { if (FX.cv) FX.cv.hidden = true; cancelAnimationFrame(FX.raf); FX.raf = 0; FX.key = ""; ARTE_APP.fx(S.fx !== false); return; }

    addEventListener("resize", sizeFx);

}
function sizeFx(){

}
function newPart(anywhere){
  const speed = FX.type === "snow" ? .6 : FX.type === "sparkles" ? 0 : 1;
  return { x: Math.random() * FX.w, y: anywhere ? Math.random() * FX.h : -20, s: 6 + Math.random() * 7,
    vy: (18 + Math.random() * 26) * speed, sway: 10 + Math.random() * 20, ph: Math.random() * 6.28,
    vr: (Math.random() - .5) * 2, rot: Math.random() * 6.28, life: Math.random(),
    c: FX.colors[Math.floor(Math.random() * FX.colors.length)] };
}
function tickFx(now){
  const dt = Math.min(.05, (now - FX.last) / 1000); FX.last = now;

    let p = FX.parts[i];
    p.ph += dt * 1.6; p.rot += p.vr * dt;
    if (FX.type === "sparkles") { p.life += dt * .35; if (p.life > 1) p = FX.parts[i] = Object.assign(newPart(true), { life:0 }); }
    else { p.y += p.vy * dt; p.x += Math.sin(p.ph) * p.sway * dt; if (p.y > FX.h + 20) p = FX.parts[i] = newPart(false); }
    drawPart(g, p);

}
function drawPart(g, p){

  switch (FX.type) {
    case "confetti": g.scale(Math.cos(p.ph * 2), 1); g.fillRect(-s / 2, -s / 4, s, s / 2); break;
    case "petals": g.beginPath(); g.ellipse(0, 0, s * .55, s * .3, 0, 0, 6.283); g.fill(); break;
    case "snow": g.beginPath(); g.arc(0, 0, s * .32, 0, 6.283); g.fill(); break;
    case "hearts": g.scale(s / 12, s / 12); g.beginPath(); g.moveTo(0, 4); g.bezierCurveTo(-8, -1, -6, -8, 0, -4); g.bezierCurveTo(6, -8, 8, -1, 0, 4); g.fill(); break;
    case "leaves": g.beginPath(); g.moveTo(0, -s * .6); g.bezierCurveTo(s * .5, -s * .3, s * .5, s * .3, 0, s * .6); g.bezierCurveTo(-s * .5, s * .3, -s * .5, -s * .3, 0, -s * .6); g.fill(); break;

async function askClaude(turns, { onText, signal } = {}){
  if (!aiAvailable()) throw { code:"no_key" };
  const system = turns[0]?.content || "";
  const msgs = [];
  for (const t of turns.slice(1)) { const last = msgs[msgs.length-1]; if (last && last.role === t.role) last.content += "\n\n" + t.content; else msgs.push({ role:t.role, content:t.content }); }
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  if (!getKey()) { const text = (await callServer({ system, max_tokens:800, messages: msgs.map(x => ({ role:x.role, text:x.content })) }, signal)).trim(); onText?.(text); return text; }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal,
      headers:{ "content-type":"application/json", "x-api-key":getKey(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model: MODEL_FAST, max_tokens:800, system, messages: msgs }) });
  } catch (e) { if (e?.name === "AbortError") throw { code:"cancelled" }; throw { code:"offline" }; }
  if (res.status === 401 || res.status === 403) throw { code:"bad_key" };
  if (res.status === 429) throw { code:"rate_limited" };
  if (res.status >= 500) throw { code:"overloaded" };
  if (!res.ok) throw { code:"other" };
  const data = await res.json();
  const text = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("").trim();
  onText?.(text); return text;
}

async function sendChat(q){
  q = String(q || "").trim(); if (!q || ui.chatBusy) return;
  S.chat = [...(S.chat || []), { role:"user", content:q, at:new Date().toISOString() }].slice(-40);
  ui.chatBusy = true; ui.chatErr = null; save(); render();
  const turns = [{ role:"user", content: chatRules() }, ...S.chat.slice(-12).map(({ role, content }) => ({ role, content }))];
  try {
    ui.chatCtl = new AbortController();
    const text = await askClaude(turns, { signal: ui.chatCtl.signal, onText: t => {
      const el = $("#msg-live p"); if (el) { el.textContent = t; el.classList.remove("muted"); window.scrollTo(0, document.body.scrollHeight); }
    }});
    S.chat.push({ role:"assistant", content: String(text || "").trim() || "No tengo una respuesta para eso. ¿Me lo preguntas de otra forma?", at:new Date().toISOString() });
  } catch (e) {
    if (["unavailable","no_key","not_granted","offline","rate_limited","overloaded"].includes(e?.code)) {
      // Sin IA disponible: Merino contesta con sus respuestas programadas
      S.chat.push({ role:"assistant", content: offlineAnswer(q), offline:true, at:new Date().toISOString() });
      if (e.code === "offline") ui.chatErr = "Sin internet: te respondí en modo rápido.";
      if (e.code === "rate_limited" || e.code === "overloaded") ui.chatErr = "La IA está ocupada en este momento: te respondí en modo rápido.";
    } else {
      if (e?.text) S.chat.push({ role:"assistant", content: e.text, at:new Date().toISOString() });
      if (e?.code !== "cancelled") ui.chatErr = CHAT_ERRORS[e?.code] || "No pude responder en este momento. Intenta otra vez.";
    }
  } finally {
    ui.chatBusy = false; save(); render();
  }
}

const PhotoDB = (() => {
  let dbp = null;

    try { const r = indexedDB.open("tulana-fotos", 1); r.onupgradeneeded = () => r.result.createObjectStore("fotos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("fotos", mode); const q = fn(t.objectStore("fotos")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
  return { put: (id, blob) => run("readwrite", s => s.put(blob, id)), get: id => run("readonly", s => s.get(id)), del: id => run("readwrite", s => s.delete(id)) };
})();

async function deviceOCR(file){

    const id = uid(), cbs = (window.__ocrCbs ||= {});
    const timer = setTimeout(() => { delete cbs[id]; rej({ code:"ocr_fail" }); }, 40000);
    cbs[id] = { res, rej, timer };

    try { window.AndroidBridge.ocr(b64, id); } catch { clearTimeout(timer); delete cbs[id]; rej({ code:"no_ocr" }); }
  });
}

const PERIODS = {day:"Hoy",week:"Semana",month:"Mes",year:"Año"};
function donut(by, total){
  const entries = Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const pos = entries.reduce((a,[,v])=>a+v,0);
  const r = 80, C = 2*Math.PI*r; let acc = 0;
  const slices = entries.map(([cat,v]) => {
    const len = pos ? v/pos*C : 0; const gap = entries.length>1 ? Math.min(3, len*0.3) : 0;
    const sel = ui.selCat===cat, dim = ui.selCat && !sel;
    const s = `<circle class="slice" data-act="selcat" data-cat="${cat}" r="${r}" cx="110" cy="110" fill="none" stroke="${CATS[cat].c}" stroke-width="${sel?34:28}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}" opacity="${dim?.35:1}"><title>${CATS[cat].n}: ${fmt(v)}</title></circle>`;
    acc += len; return s;
  }).join("");
  const center = ui.selCat && by[ui.selCat] != null ? [CATS[ui.selCat].n, by[ui.selCat], pos ? Math.round(by[ui.selCat]/pos*100)+" %" : ""] : ["Gastaste", total, PERIODS[ui.period]];
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="Gastos por categoría">
    <circle r="${r}" cx="110" cy="110" fill="none" stroke="var(--sunk)" stroke-width="28"/>
    <g transform="rotate(-90 110 110)">${slices}</g>
    <text x="110" y="96" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(center[0])}</text>
    <text x="110" y="122" text-anchor="middle" font-size="${fmt0(center[1]).length>8?20:24}" font-weight="700" fill="var(--ink)" font-family="Figtree, sans-serif" font-weight="800">${fmt0(center[1])}</text>
    <text x="110" y="142" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Figtree, sans-serif">${esc(center[2])}</text></svg>`;
}
function nudge(){
  const w = spentBy("week"); const ant = Math.max(0, w.by.antojos||0); const share = w.total > 0 ? ant/w.total : 0;
  const rest = savePending();
  const btn = (label, v) => `<button class="btn accent sm" data-act="go" data-v="${v}" style="align-self:flex-start">${label}</button>`;
  if (canSpend() < 0) return mascotRow("preocupado", say("overspend"), {cta: S.fixed.length ? `<button class="btn accent sm" data-act="openmonth" style="align-self:flex-start">Ver gastos fijos</button>` : ""});
  const soon = fixedPending().map(f => ({ f, d: dueInfo(f) })).filter(x => x.d.days != null && x.d.days <= 3).sort((a,b) => a.d.days - b.d.days)[0];
  if (soon) return mascotRow(soon.d.days < 0 ? "preocupado" : "piensa", say(soon.d.days < 0 ? "fixed_late" : "fixed_due", { n: soon.f.name, cuando: soon.d.txt.split(" · ")[0].toLowerCase(), x: fmt0(soon.f.amt) }),
    { cta: `<button class="btn accent sm" data-act="openmonth" style="align-self:flex-start">Ver mis pagos</button>` });
  if (share > 0.15 && ant > 0) return mascotRow("preocupado", say("impulse", {p: Math.round(share*100)}), {cta: btn("Registrar un antojo evitado", "pig")});
  if (S.streak.last !== dayKey()) return mascotRow("piensa", S.streak.cur ? say("streak_risk", {n: S.streak.cur}) : say("streak_start"), {cta: btn("Escanear ticket", "scan")});

  return mascotRow("celebra", say("month_done"));
}

function merinoTip(){
  const w = spentBy("week"), ant = Math.max(0, w.by.antojos || 0), share = w.total > 0 ? ant / w.total : 0, rest = savePending();
  const btn = (label, v) => `<button class="btn accent sm" data-act="go" data-v="${v}" style="align-self:flex-start">${label}</button>`;
  let mood, text, cta = "";
  if (canSpend() < 0) { mood = "preocupado"; text = say("overspend"); }
  else if (share > 0.15 && ant > 0) { mood = "preocupado"; text = say("impulse", { p: Math.round(share * 100) }); cta = btn("Registrar un antojo evitado", "pig"); }
  else if (S.streak.last !== dayKey()) { mood = "piensa"; text = S.streak.cur ? say("streak_risk", { n: S.streak.cur }) : say("streak_start"); cta = btn("Escanear ticket", "scan"); }
  else if (rest > 0) { mood = "feliz"; text = say("month_left", { x: fmt0(rest) }); cta = btn("Aportar al cochinito", "pig"); }
  else { mood = "celebra"; text = say("month_done"); }
  const show = S.mascot !== false;
  return `<div class="say tip ${show ? "" : "noav"}">${show ? `<div class="say-av">${mascotImg(mood)}</div>` : ""}
    <div class="bubble"><b class="tip-t">Consejo de Merino</b><p>${esc(text)}</p>${cta}<button class="link small" data-act="go" data-v="chat" style="align-self:flex-start">Pregúntale a Merino ↗</button></div></div>`;

// Montos que cuentan hacia arriba y entrada escalonada al cambiar de pantalla
function animateView(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const key = S.onboarded ? ui.view + (ui.detailId || "") : "onb" + ui.onb;
  if (ui._animView === key) return;
  ui._animView = key;
  document.querySelector(".app")?.classList.add("enter");
  if (reduce) return;
  document.querySelectorAll(".countup").forEach(el => {
    const to = +el.dataset.to, f = el.dataset.dec === "0" ? fmt0 : fmt, t0 = performance.now(), d = 1000;
    (function step(t){ const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); el.textContent = f(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); })(t0);
  });
}

    ((S.fixedPaid ||= {})[month] ||= {})[f.id] = rec.id;
    ui.payFixed = null; bumpStreak(); save(); render(); toast(`${f.name} pagado con ${acc.name}: −${fmt(f.amt)}`);
  },
  pickphoto: () => { ui.scan = null; render(); $("#photo")?.click(); },
  readtext: () => { const t = $("#pasted")?.value.trim(); if (!t) { toast("Pega primero el texto del ticket"); return; } runScan({text:t}); },
  example: () => runScan({text:SAMPLE_TICKET}),
  example2: () => runScan({text:SAMPLE_TICKET_2}),
  cancelscan: () => { ui.ctl?.abort(); ui.scan = null; render(); },
  manual: () => { ui.draft = { source:"manual", merchant:"", at:new Date().toISOString(), accountId:S.accounts.find(a=>a.type!=="credito")?.id || S.accounts[0]?.id, roundup:false, warnings:[], notes:[], total:null,
      items:[{id:uid(), name:"", raw:"", qty:1, total:0, cat:"antojos", conf:1, review:false}] }; ui.scan=null; ui.view="review"; render(); $("[data-k=name]")?.focus(); },
  discard: () => { const ed = ui.draft?.editingId; ui.draft = null; if (ed) { ui.view = "detail"; ui.detailId = ed; } else ui.view = "scan"; render(); },
  okcat: t => { const it = ui.draft?.items.find(i => i.id === t.dataset.id); if (it) { it.review = false; it.conf = 1; } render(); },
  delitem: t => { ui.draft.items = ui.draft.items.filter(i=>i.id!==t.dataset.id); render(); },
  additem: () => { ui.draft.items.push({id:uid(), name:"", raw:"", qty:1, total:0, cat:"otros", conf:1, review:false}); render(); const n = document.querySelectorAll("[data-item][data-k=name]"); n[n.length-1]?.focus(); },
  fixspread: () => { spreadAmount(ui.draft.items, draftDiff(ui.draft)); ui.draft.notes = [...(ui.draft.notes||[]), "Repartí la diferencia entre los artículos según su precio."]; render(); },
  fixadjust: () => { const d = ui.draft, diff = draftDiff(d), big = d.items.reduce((a,b)=>b.total>a.total?b:a, d.items[0]);
    d.items.push({ id:uid(), name: diff < 0 ? "Descuento del ticket" : "Diferencia del ticket", raw:"", qty:1, total:diff, cat: big?.cat || "otros", conf:1, review: diff > 0 }); render(); },
  fixusesum: () => { ui.draft.total = draftSum(ui.draft); render(); },
  pickacc: t => { if (!ui.draft) return; ui.draft.accountId = t.dataset.id; ui.draft.accountWhy = null; render(); },
  confirm: () => {
    const d = ui.draft;
    if (!d.accountId && S.accounts.length) { toast("Elige con qué pagaste"); document.querySelector(".paypick")?.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
    if (d.items.find(i=>!i.name.trim() || !i.total)) { toast("Cada artículo necesita nombre y precio"); return; }
    if (draftMismatch(d)) { toast("Resuelve la diferencia con el total del ticket"); return; }
    confirmDraft();
  },
  quickamt: t => { const i = $("#pig-amt"); if (i) i.value = toInput(+t.dataset.v); document.querySelectorAll(".amt3 button").forEach(b => b.setAttribute("aria-pressed", b === t)); },
  cfg: t => { ui.cfg = t.dataset.k; ui.cfgFresh = true; ui._cfgFrom = t.dataset.k; ui.confirmReset = false; ui.confirmDemo = false; render(); setTimeout(() => $(".sheet2.cfg .sh-x")?.focus(), 30); },
  closecfg: () => { const from = ui._cfgFrom; ui.cfg = null; render(); if (from) document.querySelector(`[data-act=cfg][data-k="${from}"]`)?.focus(); },
  sheet: t => { ui.sheet = { k: t.dataset.k, id: t.dataset.id }; ui._sheetFrom = t.dataset.id; render(); setTimeout(() => $(".sh-x")?.focus(), 30); },
  closesheet: () => { const from = ui._sheetFrom; ui.sheet = null; render(); if (from) document.querySelector(`[data-act=sheet][data-id="${from}"]`)?.focus(); },
  contrib: t => {
    const g = activeGoal(); if (!g) return;
    const amt = parseMoney($("#pig-amt")?.value); if (!amt) { toast("Escribe un monto primero"); $("#pig-amt")?.focus(); return; }
    const r = t.dataset.r, acc = S.accounts.find(a=>a.id===$("#pig-acc")?.value) || S.accounts[0]; ui.pigAcc = acc.id;
    if (r==="retiro") {
      const take = Math.min(amt, savedFor(g.id)); if (take <= 0) { toast(`“${g.name}” no tiene dinero para sacar`); return; }
      addContribution(-take, "retiro", acc.id, null, g.id); save(); render(); toast(`Sacaste ${fmt(take)} de “${g.name}” a ${acc.name}`); return;
    }
    ui.cheer = true; const xp = addContribution(amt, r, acc.id, null, g.id); save(); render();
    const neg = acc.balance < 0 ? ` · Tu saldo en ${acc.name} quedó en negativo` : "";
    toast((r==="antojo_evitado" ? `Antojo convertido en ahorro · +${xp} XP` : `${fmt(amt)} de ${acc.name} a “${g.name}” · +${xp} XP`) + neg);
  },
  pickgoal: t => { ui.goalId = t.dataset.id; ui.pigFrom = null; render(); },
  addgoal: () => {
    const name = $("#ng-name")?.value.trim(), target = parseMoney($("#ng-target")?.value);
    if (!name) { toast("Ponle nombre a tu meta"); $("#ng-name")?.focus(); return; }
    if (!target) { toast("Escribe cuánto necesitas"); $("#ng-target")?.focus(); return; }
    const g = { id:uid(), name, target }; (S.goals ||= []).push(g); ui.goalId = g.id; ui.goalForm = false; save(); render(); toast(`Meta “${name}” creada`);
  },
  primarygoal: t => { const i = S.goals.findIndex(g=>g.id===t.dataset.id); if (i > 0) { const [g] = S.goals.splice(i,1); S.goals.unshift(g); save(); render(); toast(`“${g.name}” ahora recibe tus redondeos`); } },
  delgoal: t => {
    const g = S.goals.find(x=>x.id===t.dataset.id); if (!g) return;
    if (S.goals.length <= 1) { toast("Necesitas al menos una meta"); return; }
    if (savedFor(g.id) > 0) { toast(`Primero saca el dinero de “${g.name}” a una cuenta`); return; }
    S.goals = S.goals.filter(x=>x.id!==g.id); S.contributions = S.contributions.filter(c=>c.goalId!==g.id);
    if (ui.goalId === g.id) ui.goalId = null; save(); render(); toast(`Meta “${g.name}” eliminada`);
  },
  ask: t => sendChat(t.dataset.q),
  stopchat: () => ui.chatCtl?.abort(),
  clearchat: () => { S.chat = []; ui.chatErr = null; save(); render(); },
  savekey: () => { const v = $("#p-key")?.value.trim(); if (!v) { toast("Pega tu clave primero"); return; } if (!v.startsWith("sk-")) { toast("Esa clave no parece válida: empieza con sk-"); return; } setKey(v); render(); toast("Clave guardada. Ya puedes escanear fotos"); },
  delkey: () => { setKey(""); render(); toast("Clave eliminada"); },
  remtoggle: t => { S.reminders = { ...remCfg(), on: t.checked }; save(); render(); toast(t.checked ? "Recordatorios activados" : "Recordatorios apagados"); },
  remtest: () => { try { AndroidBridge.testReminder(); } catch {} },
  google: () => loginGoogle(),
  setlang: t => setLang(t.dataset.l),
  updskip: t => { S.updSkip = +t.dataset.c; ui.update = null; save(); render(); },
  cfgback: () => { ui.cfg = null; ui.confirmReset = false; ui.confirmDelAcc = false; ui.confirmLogout = false; render(); window.scrollTo(0, 0); },
  sethours: t => { S.profile.workHours = +t.dataset.h; if (S.onboarded) save(); render(); },
  retostart: t => { retosState().active[t.dataset.id] = { start: new Date().toISOString() }; ui.retoDone = null; save(); render(); toast("¡Reto aceptado! Te aviso cuando lo cumplas"); },
  retoquit: t => { delete retosState().active[t.dataset.id]; save(); render(); },
  retook: () => { ui.retoDone = null; render(); },
  weeklyseen: t => { S.weeklySeen = t.dataset.k; save(); render(); },
  share: async t => { if (S.demo) { toast("Sal del ejemplo para compartir tus propios logros"); return; }
    if (!t.dataset.kind) { const txt = t.dataset.t || "TuLana"; try { await navigator.clipboard.writeText(txt); toast("Texto copiado: pégalo donde lo quieras compartir"); } catch { toast(txt); } return; }
    shareCard(shareWhat(t.dataset.kind, t.dataset.id)).catch(() => toast("No se pudo crear la imagen")); },
  usebackup: () => restoreBackup(),
  keeplocal: () => { ui.chooseBackup = null; render(); backupNow(true); },
  backupnow: () => backupNow(true),
  logout: () => logoutGoogle(),
  asklogout: () => { ui.confirmLogout = true; render(); },
  nologout: () => { ui.confirmLogout = false; render(); },
  askdelacc: () => { ui.confirmDelAcc = true; render(); },
  nodelacc: () => { ui.confirmDelAcc = false; render(); },
  delcuenta: () => deleteAccount(),   // (antes se llamaba "delacc" y chocaba con quitar una tarjeta o cuenta)
  askreset: () => { ui.confirmReset = true; render(); },
  noreset: () => { ui.confirmReset = false; render(); },
  reset: () => { S = freshState(); ui.onb = 0; ui.view = "home"; ui.goalId = null; ui.confirmReset = false; save(); render(); },
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.tagName === "DIV" && e.target.closest("button,a,input,select")) return;
  ACT[t.dataset.act]?.(t, e);
});
document.addEventListener("toggle", e => { const d = e.target; if (d?.dataset?.fold) ui.open[d.dataset.fold] = d.open; }, true);
document.addEventListener("submit", e => { if (e.target.id === "chatform") { e.preventDefault(); const i = $("#chat-in"); sendChat(i?.value); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) { ACT.closesheet(); } else if (e.key === "Escape" && ui.cfg) { ACT.closecfg(); } });
document.addEventListener("keydown", e => { if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });
// Mientras escribes una cantidad, agrega las comas sin mover el cursor
document.addEventListener("input", e => {
  const el = e.target;
  if (el.tagName !== "INPUT" || el.inputMode !== "decimal" || e.inputType === "insertCompositionText") return;
  const old = el.value, pos = el.selectionStart ?? old.length, keep = old.slice(0, pos).replace(/[^\d.\-−–]/g, "").length, nv = groupMoney(old);
  if (nv === old) return;
  el.value = nv; let n = 0, c = 0; while (c < nv.length && n < keep) { if (/[\d.\-]/.test(nv[c])) n++; c++; }
  try { el.setSelectionRange(c, c); } catch {}
}, true);
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) {
    const v = el.type==="range" ? +el.value : el.dataset.money !== undefined ? parseMoney(el.value) : el.value;
    setPath(el.dataset.bind, v);
    const next = $("#next");
    if (next) {
      if (ui.onb===1) next.disabled = !S.profile.name.trim();
      if (ui.onb===6) next.disabled = !(S.goal.name.trim() && S.goal.target>0);
    }
    if ($("#pctv")) $("#pctv").textContent = S.profile.savingsPct + " %";
    if ($("#plan")) $("#plan").innerHTML = planBox();
  }
  if (el.dataset.live) {
    const v = el.type==="range" ? +el.value : el.dataset.money !== undefined ? parseMoney(el.value) : el.value;
    setPath(el.dataset.live, v);
    if ($("#pctv")) $("#pctv").textContent = S.profile.savingsPct + " %";
    if (el.id === "p-pct") { if ($("#ah-m")) $("#ah-m").innerHTML = mascotImg(merinoFluff() >= 1 ? "celebra" : "feliz"); if ($("#ah-t")) $("#ah-t").innerHTML = ahorroTxt(); }
    const box = el.closest(".fold-body, .card, .sheet2")?.querySelector(".sumbox"); if (box) box.innerHTML = planBox();
    save();
  }
  if (el.dataset.income) {
    const i = S.profile.incomes.find(x=>x.id===el.dataset.income);
    if (i) { i[el.dataset.k] = el.dataset.k==="amt" ? parseMoney(el.value) : el.value; const s = $("#inc-sum"); if (s) s.textContent = S.onboarded ? fmt0(monthlyIn()) + "/mes" : fmt(monthlyIn()); if (S.onboarded) save();
      if (i.src && $("#pm-" + i.src)) $("#pm-" + i.src).textContent = payMonthly(i);
      if (!S.onboarded && ui.onb === 2 && $("#next")) { const w = srcIncome("work"), b = srcIncome("beca"); $("#next").disabled = !(S.profile.student !== null && S.profile.work && (!w || w.amt > 0) && (!b || b.amt > 0)); } }
  }
  if (el.dataset.fixed) { const f = S.fixed.find(x=>x.id===el.dataset.fixed), k = el.dataset.k;
    if (f) { f[k] = el.type === "checkbox" ? el.checked : k==="amt" ? parseMoney(el.value) : k==="dueDay" ? (+el.value || null) : el.value; if (S.onboarded) save(); } }
  if (el.dataset.acc) { const a = S.accounts.find(x=>x.id===el.dataset.acc); if (a) { a[el.dataset.k] = el.dataset.k==="balance" ? parseSigned(el.value) : el.value; if ($("#cap")) $("#cap").textContent = fmt(cashBalance()); if (S.onboarded) save(); } }
  if (el.dataset.goal) { const g = S.goals.find(x=>x.id===el.dataset.goal); if (g) { g[el.dataset.k] = el.dataset.k==="target" ? parseMoney(el.value) : el.value; save(); } }
  if (el.dataset.budget) { (S.budgets ||= {})[el.dataset.budget] = parseMoney(el.value); save(); }
  if (el.dataset.item && ui.draft) {
    const it = ui.draft.items.find(x=>x.id===el.dataset.item); if (!it) return;
    if (el.dataset.k==="total") { const v = parseSigned(el.value); it.total = v < 0 ? v : Math.round(v * (it.qty || 1)); }
    else if (el.dataset.k==="name") it.name = el.value;
  }
  if (el.id === "rv-total" && ui.draft) ui.draft.total = el.value.trim() ? parseSigned(el.value) : null;
  if (el.dataset.draft && ui.draft && el.type!=="checkbox") ui.draft[el.dataset.draft] = el.value;
  if (el.id === "chat-in") { el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight) + "px"; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "p-theme") { S.themeMode = el.value; save(); render(); toast(el.value === "auto" ? "Tema automático según la fecha" : "Vista previa: " + THEMES[el.value].name); return; }
  if (el.id === "p-fx") { S.fx = el.checked; save(); render(); return; }
  if (el.id === "p-mascot") { S.mascot = el.checked; save(); render(); return; }
  if (el.id === "p-photos") { S.keepPhotos = el.checked; save(); toast(el.checked ? "Las fotos se guardarán en este dispositivo" : "Las fotos nuevas ya no se guardarán"); return; }
  if ((el.id === "photo" || el.id === "photo2") && el.files?.[0]) { const f = el.files[0]; el.value = ""; runScan({file:f}); return; }
  if (el.id === "rv-total" && ui.draft) { render(); return; }
  if (el.dataset.income && el.dataset.k === "freq") { const s = $("#inc-sum"); if (s) s.textContent = S.onboarded ? fmt0(monthlyIn()) + "/mes" : fmt(monthlyIn()); }
  if (el.dataset.item && el.dataset.k==="cat" && ui.draft) { const it = ui.draft.items.find(x=>x.id===el.dataset.item); if (it) { it.cat = el.value; it.review = false; } render(); }
  if (el.dataset.item && el.dataset.k==="total" && ui.draft) render();
  if (el.dataset.draft==="roundup" && ui.draft) ui.draft.roundup = el.checked;
  if (el.dataset.draft==="accountId" && ui.draft) { ui.draft.accountId = el.value; render(); }
});

// ───────────────────────── Arranque ─────────────────────────
(function boot(){
  const local = loadLocal();
  if (local && local.v === 1) S = Object.assign(freshState(), local);
  if (S.lang && S.lang !== LANG) { LANG = S.lang; try { localStorage.setItem("tulana-lang", LANG); } catch {} document.documentElement.lang = LANG; }
  render();
})();
// Recordatorios de Merino: el teléfono los manda aunque la app esté cerrada
function remCfg(){ const r = S.reminders || {}; return { on: r.on !== false, hour: r.hour ?? 20 }; }
function reminderPayload(){
  const r = remCfg(), paid = paidFixedMap();
  const wk = weekStats(0);
  return JSON.stringify({ on: !!S.onboarded && r.on, hour: r.hour, minute: 0, name: S.profile?.name || "",
    lang: LANG, weekly: { wk: wk.key, title: tr("Tu resumen de la semana 🐑"), text: tr(weeklyText(wk)) },
    streak: S.streak?.cur || 0, streakLast: S.streak?.last || "",
    fixed: (S.fixed || []).filter(f => f.amt > 0 && f.dueDay).map(f => ({ name: f.name || "tu pago", amt: fmt0(f.amt), dueDay: f.dueDay, paid: paid[f.id] ? monthKey() : "" })) });
}
let remTimer = null;
function syncReminders(){ if (!window.AndroidBridge?.setReminders) return; clearTimeout(remTimer); remTimer = setTimeout(() => { try { AndroidBridge.setReminders(reminderPayload()); } catch {} }, 400); }
{ const baseSave = save; save = function(...a){ const out = baseSave.apply(this, a); syncReminders(); return out; }; }
syncReminders();
window.__notifPerm = ok => { if (!ok) toast("Sin permiso no puedo mandarte recordatorios. Puedes activarlo en los ajustes del teléfono."); };
document.addEventListener("change", e => { if (e.target.id === "rem-hour") { S.reminders = { ...remCfg(), hour: +e.target.value }; save(); toast(`Te aviso a las ${e.target.value}:00`); } });

// Botón "atrás" de Android: regresa de pantalla en vez de cerrar la app
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
setTimeout(checkUpdate, 2500);
window.onAndroidBack = function(){
  if (!S.onboarded) { if (ui.onb > 0) { ui.onb--; render(); return true; } return false; }
  if (ui.view === "profile" && ui.cfg) { ui.cfg = null; render(); window.scrollTo(0,0); return true; }
  if (ui.view === "review") { ui.draft = null; ui.view = "scan"; render(); return true; }
  if (ui.view !== "home") { ui.view = "home"; ui.selCat = null; render(); window.scrollTo(0,0); return true; }
  return false;
};
