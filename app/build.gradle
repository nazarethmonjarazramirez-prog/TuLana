plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.cochinito.app'
    compileSdk 34

    defaultConfig {
        applicationId "mx.cochinito.app"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.2.2"
        // Solo procesadores de celular (ARM): el APK pesa casi la mitad y se descarga más rápido
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Firma fija de TuLana: todas las versiones llevan la misma, así se actualizan encima sin perder datos.
    // La contraseña vive en el secreto TULANA_KS_PASS de GitHub (nunca en el código).
    def ksPass = System.getenv('TULANA_KS_PASS')
    signingConfigs {
        tulana {
            storeFile file('tulana.keystore')
            storeType 'pkcs12'
            storePassword ksPass ?: ''
            keyAlias 'tulana'
            keyPassword ksPass ?: ''
        }
    }

    buildTypes {
        debug {
            if (ksPass) signingConfig signingConfigs.tulana
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}

dependencies {
    // Alinea las bibliotecas de Kotlin en una sola versión (evita clases duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    // Lector de texto en el teléfono (funciona sin internet; el modelo viene dentro del APK)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Recordatorios diarios aunque la app esté cerrada
    implementation 'androidx.work:work-runtime:2.9.1'
    // Iniciar sesión con Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
