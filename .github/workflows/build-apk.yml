name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conectar con el servidor de IA de TuLana (si está configurado)
        env:
          TULANA_SERVER: ${{ vars.TULANA_SERVER }}
          TULANA_TOKEN: ${{ vars.TULANA_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json
          p = 'app/src/main/assets/index.html'
          s = open(p, encoding='utf-8').read()
          url = os.environ.get('TULANA_SERVER', '').strip().rstrip('/')
          tok = os.environ.get('TULANA_TOKEN', '').strip()
          if url:
              s = s.replace('"__TULANA_SERVER__"', json.dumps(url)).replace('"__TULANA_TOKEN__"', json.dumps(tok))
              print('Servidor de IA:', url)
          else:
              print('Sin servidor de IA: la app usará el modo sin IA')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Compilar APK
        env:
          TULANA_KS_PASS: ${{ secrets.TULANA_KS_PASS }}
        run: |
          if [ -n "$TULANA_KS_PASS" ]; then echo "Firmando con la llave de TuLana"; else echo "::warning::Falta el secreto TULANA_KS_PASS: se firmará con una llave temporal"; fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk TuLana.apk

      - name: Mostrar la firma del APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs TuLana.apk | grep -E "DN|SHA-256" || true

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TuLana-APK
          path: TuLana.apk

      - name: Publicar en Releases (para descargar desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TuLana v1.0.${{ github.run_number }}
          body: Descarga TuLana.apk desde tu teléfono Android e instálalo.
          files: TuLana.apk

      # Aviso de actualización: la app revisa este archivo para saber si hay versión nueva
      - name: Preparar version.json
        run: |
          mkdir -p ver
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          NOTAS=$(cat version-notas.txt 2>/dev/null || echo "")
          python3 -c "import json,sys; print(json.dumps({'code':int(sys.argv[1]),'version':sys.argv[2],'notas':sys.argv[3]}, ensure_ascii=False))" "$CODE" "$NAME" "$NOTAS" > ver/version.json
          cat ver/version.json

      - name: Publicar version.json en la página
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ver
          publish_branch: gh-pages
          keep_files: true
