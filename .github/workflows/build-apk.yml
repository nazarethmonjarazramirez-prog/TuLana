name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conectar con el servidor de IA de TuLana (si está configurado)
        env:
          TULANA_SERVER: ${{ vars.TULANA_SERVER }}
          TULANA_TOKEN: ${{ vars.TULANA_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json
          p = 'app/src/main/assets/index.html'
          s = open(p, encoding='utf-8').read()
          url = os.environ.get('TULANA_SERVER', '').strip().rstrip('/')
          tok = os.environ.get('TULANA_TOKEN', '').strip()
          if url:
              s = s.replace('"__TULANA_SERVER__"', json.dumps(url)).replace('"__TULANA_TOKEN__"', json.dumps(tok))
              print('Servidor de IA:', url)
          else:
              print('Sin servidor de IA: la app usará el modo sin IA')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk TuLana.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TuLana-APK
          path: TuLana.apk

      - name: Publicar en Releases (para descargar desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TuLana v1.0.${{ github.run_number }}
          body: Descarga TuLana.apk desde tu teléfono Android e instálalo.
          files: TuLana.apk
