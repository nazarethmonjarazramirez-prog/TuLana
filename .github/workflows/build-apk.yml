name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk Cochinito.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Cochinito-APK
          path: Cochinito.apk

      - name: Publicar en Releases (para descargar desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cochinito v1.0.${{ github.run_number }}
          body: Descarga Cochinito.apk desde tu teléfono Android e instálalo.
          files: Cochinito.apk
